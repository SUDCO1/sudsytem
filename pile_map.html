   แต่เป็น "ตำบลคลองด่าน" คนละตำบล ห่างจากที่ถาม 18 กิโล
   ส่วนอันที่ถูกได้ 96.7 ตกไปอันดับสอง — เด้งอัตโนมัติคือพาคนขับรถไปผิดที่โดยไม่รู้ตัว
   เลยต้องขึ้นรายการพร้อมตำบล/อำเภอ/จังหวัดเต็ม ๆ ให้คนยืนยันเอง

   และเรียงตาม "ใกล้จุดที่กำลังดูอยู่" ไม่ใช่เรียงตามคะแนนของ Esri
   เพราะปกติคนเลื่อนแผนที่ไปแถวที่จะไปอยู่แล้ว ตัวที่ใกล้จึงมักเป็นตัวที่ตั้งใจ
   ============================================================ */
/* ใช้สองเจ้า ไม่ใช่เพราะเผื่อเหนียว แต่เพราะวัดแล้วเก่งคนละเรื่องกันจริง ๆ
   ------------------------------------------------------------
   OpenStreetMap (Nominatim) และ Esri ถามพร้อมกันทุกครั้ง ทั้งคู่ไม่ต้องสมัคร ไม่ต้องใช้คีย์

   ที่วัดได้จากคำค้นแบบที่คนของเราใช้จริง
     "แยกรัชโยธิน"                    OSM ถูก              Esri ไม่เจอเลย
     "ศูนย์ประชุมแห่งชาติสิริกิติ์"      OSM ถูก              Esri ได้ 74.1 ตกเกณฑ์
     "ตำบลคลองสวน อำเภอบางบ่อ"      OSM ถูกตั้งแต่อันแรก   Esri อันดับ 1 ผิดตำบล ห่าง 18 กม.
     "หมู่บ้านนันทวัน พระราม 9"        OSM ผิด ได้นนทบุรี     Esri ถูก ได้สะพานสูง
     "999 ถนนพระราม 1"               OSM ได้ 999/9 ใกล้ ๆ   Esri ได้ 999 ตรงเลขที่
   สามข้อแรก OSM ชนะ สองข้อหลัง Esri ชนะ ไม่มีเจ้าไหนดีกว่าอีกเจ้าในทุกกรณี
   จึงไม่เลือกข้าง ถามทั้งคู่แล้วเอามารวมกัน (ดูเหตุผลเต็มที่ runFind)

   ข้อแม้ของการใช้ Nominatim ฟรี ที่ของเราทำตามอยู่แล้ว
     ยิงได้ไม่เกินวินาทีละครั้ง  — ค้นตอนกด Enter เท่านั้น หนึ่งครั้งที่กดคือหนึ่งคำขอ
     ห้ามยิงรัวเป็นชุด        — ไม่มีการค้นอัตโนมัติที่ไหนในหน้านี้เลย
     ต้องแสดงที่มา            — ใส่ไว้ท้ายรายการผลแล้ว (.fr.cred)
     ต้องย้ายเจ้าได้ถ้าเขาขอ    — ลบ askOSM ออกจาก Promise.allSettled บรรทัดเดียว Esri รับไปต่อได้ทันที */
const OSM_URL     = 'https://nominatim.openstreetmap.org/search';
const GEOCODE_URL = 'https://geocode.arcgis.com/arcgis/rest/services/World/GeocodeServer/findAddressCandidates';
/* เส้นแบ่งระหว่าง "เจอจริง" กับ "เดาสุ่ม" ของฝั่ง Esri
   วัดจากคำค้นเดียวกันคือ "ซอยลาดพร้าว 101"
     ถนนลาดพร้าว 101 ที่ถูกต้อง ได้ 81.9
     ซันนี่ลาดพร้าว ที่คนละที่   ได้ 70.7
   75 เลยอยู่ตรงกลางพอดี รับของจริงไว้ ตัดของเดาออก
   ของที่ต่ำกว่านี้ถ้าปล่อยผ่านจะดูเหมือนเจอทั้งที่ผิด บอกว่าไม่เจอตรงไปตรงมากว่า

   ที่ทำให้ฝั่งถูกต้องขึ้นมาถึง 81.9 ได้คือพารามิเตอร์ location ที่ส่งจุดกลางจอไปถ่วงน้ำหนัก
   ถ้าไม่ส่ง คำค้นเดิมเหลือแต่ 70.7 คือตกเกณฑ์หมด กลายเป็นค้นซอยไม่เจอเลย */
const FIND_MIN_SCORE = 75;
const FIND_MAX = 6;

const fQ     = document.getElementById('findQ');
const fRes   = document.getElementById('findRes');
const fClear = document.getElementById('findClear');
const fGo    = document.getElementById('findGo');

let findMarker = null, findAbort = null, findHits = [];

const fHide = () => { fRes.classList.remove('show'); fRes.innerHTML = ''; };
const fMsg  = html => { fRes.innerHTML = '<div class="fr msg">' + html + '</div>'; fRes.classList.add('show'); };

/* ---------- แกะพิกัดจากข้อความ ---------- */
// ยอมรับ "13.7,100.6" และ "13.7 100.6" — ต้องมีแค่ตัวเลขสองตัวเท่านั้น ไม่งั้นไปตีกับชื่อที่มีเลข
const COORD_RE = /^\s*(-?\d{1,2}(?:\.\d+)?)\s*[, ]\s*(-?\d{1,3}(?:\.\d+)?)\s*$/;
function pickCoord(s) {
  const m = COORD_RE.exec(s);
  if (!m) return null;
  const lat = +m[1], lng = +m[2];
  if (!isFinite(lat) || !isFinite(lng) || Math.abs(lat) > 90 || Math.abs(lng) > 180) return null;
  return L.latLng(lat, lng);
}

/* ลิงก์แผนที่มีตัวเลขหลายชุดและความหมายไม่เหมือนกัน ต้องไล่ให้ถูกลำดับ
     !3d!4d  = ตัวหมุดจริง            <- อันนี้ตรงที่สุด เอาก่อน
     q=/ll=  = จุดที่ลิงก์ชี้ไป
     @       = กล้องเล็งอยู่ตรงไหน      <- มักเยื้องจากหมุด เอาเป็นทางเลือกสุดท้าย */
function pickFromUrl(s) {
  let m = s.match(/!3d(-?\d+(?:\.\d+)?)!4d(-?\d+(?:\.\d+)?)/);
  if (m) return L.latLng(+m[1], +m[2]);
  m = s.match(/[?&](?:q|query|ll|sll|daddr|center)=(?:loc:)?(-?\d+(?:\.\d+)?),\s*(-?\d+(?:\.\d+)?)/);
  if (m) return L.latLng(+m[1], +m[2]);
  m = s.match(/@(-?\d+(?:\.\d+)?),(-?\d+(?:\.\d+)?)/);
  if (m) return L.latLng(+m[1], +m[2]);
  return null;
}
const IS_URL     = /https?:\/\//i;
const SHORT_LINK = /(maps\.app\.goo\.gl|goo\.gl|bit\.ly|g\.co|lin\.ee)\//i;

/* ---------- พาไปที่หมาย ---------- */
function clearFindMarker() {
  if (findMarker) { map.removeLayer(findMarker); findMarker = null; }
}
function goTo(ll, label, ext) {
  // เช็กก่อนลบที่หมายเดิม — ค้นพลาดแล้วของเก่าหายไปด้วยคือเสียของที่ยังใช้อยู่
  if (!TH_BOUNDS.contains(ll)) {
    fMsg('พิกัดนี้อยู่นอกประเทศไทย (' + ll.lat.toFixed(4) + ', ' + ll.lng.toFixed(4) + ')<br>แผนที่นี้ดูได้เฉพาะในไทย');
    return;
  }
  clearFindMarker();
  fHide();
  findMarker = L.marker(ll, {
    // จุดแหลมของหยดน้ำอยู่ล่างกลาง หลังหมุน 45 องศาแล้วเลยพ้นกล่อง 19px ลงไปอีกราว 4px
    icon: L.divIcon({ className:'', html:'<div class="fmk"></div>', iconSize:[19,19], iconAnchor:[10,23] }),
    keyboard:false, zIndexOffset:1000
  }).addTo(map);
  if (label) {
    // ติดชื่อค้างไว้เลย ไม่ต้องให้ไปกดดู — ตอนนี้ป้ายชื่อนอกกรุงเทพถูกตัดไปแล้ว
    // ที่หมายที่ค้นเจอจึงเป็นตัวหนังสือชิ้นเดียวบนจอที่บอกได้ว่านี่คือที่ไหน
    findMarker.bindTooltip(label, { permanent:true, direction:'right', offset:[11,-9] }).openTooltip();
  }
  // แตะหมุดที่หมายเพื่อเอาออก ไม่ต้องหาปุ่มปิด
  findMarker.on('click', clearFindMarker);

  // Esri ส่งขอบเขตมาด้วย ตำบลทั้งตำบลกับบ้านเลขที่เดียวควรได้ระยะซูมคนละแบบ
  const box = (ext && isFinite(ext.ymin) && isFinite(ext.xmin))
            ? L.latLngBounds([ext.ymin, ext.xmin], [ext.ymax, ext.xmax]) : null;
  flyAndLand(ll, box);
}

/* บินไปแบบมีประกันว่าถึงที่หมายจริง
   ------------------------------------------------------------
   ใช้ flyTo เพราะมันถูกกว่า ไม่ใช่แค่สวยกว่า — ระหว่างบินมันนับเป็นการซูม
   ซึ่งเราตั้ง updateWhenZooming:false ไว้แล้ว ไทล์ของระดับที่บินผ่านเลยไม่ถูกสั่งโหลด
   วัดจริง: บินจาก z11 ไป z16 ใช้ 11 ใบ ส่วนกระโดดทันทีใช้ 29 ใบ

   แต่ flyTo พึ่งจังหวะวาดภาพของเบราว์เซอร์ ซึ่งไม่ได้การันตีว่าจะมาตรงเวลา
   ทดสอบ 10 ครั้ง ไปถึง 9 ครั้ง อีกครั้งคือ "ไม่ขยับเลย" แผนที่ค้างอยู่ที่เดิมเงียบ ๆ
   สำหรับปุ่มพาไปที่หมาย การเงียบแล้วไม่ไปไหนคือพังแบบที่คนใช้ไม่รู้ว่าพัง
   เลยตั้งเวลาเช็กไว้ ถ้าเลยเวลาบินแล้วยังไม่ถึง ก็กระโดดไปให้เลย
   ช้ากว่าเล็กน้อยแต่ไปถึงแน่นอน */
let flyGuard = null;
function flyAndLand(ll, box) {
  const target = box ? box.getCenter() : ll;
  const zoom   = Math.max(map.getZoom(), 16);
  if (box) map.flyToBounds(box, { maxZoom: 17, duration: 0.8 });
  else     map.flyTo(ll, zoom, { duration: 0.8 });

  clearTimeout(flyGuard);
  flyGuard = setTimeout(() => {
    if (map.distance(map.getCenter(), target) < 200) return;   // ถึงแล้ว ไม่ต้องทำอะไร
    if (box) map.fitBounds(box, { maxZoom: 17, animate: false });
    else     map.setView(ll, zoom, { animate: false });
  }, 1200);
}
/* ถ้าคนลากแผนที่เองระหว่างบิน แปลว่าเขาเปลี่ยนใจแล้ว ต้องยกเลิกตัวประกัน
   ไม่งั้นมันจะกระชากแผนที่กลับไปที่หมายเดิมทั้งที่คนกำลังเลื่อนดูที่อื่นอยู่ */
map.on('dragstart', () => clearTimeout(flyGuard));

const distTxt = m =>
  m < 1000   ? 'ห่างจากจุดที่ดูอยู่ ' + (Math.round(m / 10) * 10) + ' ม.'
: m < 100000 ? 'ห่างจากจุดที่ดูอยู่ ' + (m / 1000).toFixed(1) + ' กม.'
             : 'ห่างจากจุดที่ดูอยู่ ' + Math.round(m / 1000) + ' กม.';

/* ---------- ตัวหลัก ---------- */
async function runFind() {
  const s = fQ.value.trim();
  if (!s) { fHide(); return; }

  if (SHORT_LINK.test(s)) {
    /* ลิงก์ย่อต้องวิ่งไปถามเซิร์ฟเวอร์ต้นทางว่าย่อมาจากอะไร
       ซึ่งเบราว์เซอร์ห้ามเว็บเราทำกับเว็บคนอื่น (CORS) ทำฝั่งหน้าเว็บไม่ได้จริง ๆ
       ไม่ใช่ขี้เกียจทำ — บอกทางออกที่ใช้ได้จริงแทน */
    fMsg('ลิงก์แบบย่อยังอ่านไม่ได้ครับ<br>' +
         '<b>วิธีแก้:</b> เปิดลิงก์นั้นหนึ่งครั้งให้มันกลายเป็นลิงก์ยาว แล้วคัดลอกจากช่องที่อยู่มาวางใหม่<br>' +
         'หรือกดค้างบนแผนที่ในแอป แล้วเลือก "คัดลอกพิกัด" มาวางตรงนี้เลยก็ได้');
    return;
  }

  const isUrl = IS_URL.test(s);
  const ll = isUrl ? pickFromUrl(s) : pickCoord(s);
  if (ll) { goTo(ll, isUrl ? 'จากลิงก์ที่วาง' : 'พิกัดที่ค้นหา'); return; }
  if (isUrl) { fMsg('ลิงก์นี้ไม่มีพิกัดอยู่ข้างใน<br>ลองใช้ "คัดลอกพิกัด" จากแอปแผนที่มาวางแทน'); return; }

  /* ค้นชื่อไซต์งานของเราเองก่อนเสมอ
     ของพวกนี้อยู่ในเครื่องอยู่แล้ว จึงได้ผลทันทีและใช้ได้ตอนไม่มีเน็ต
     และต้องมาก่อนผลจากแผนที่โลกด้วย เพราะถ้ามีคนตั้งชื่อหมุดว่า "บ้านคุณสมชาย"
     แล้วพิมพ์คำนี้มา เขาหมายถึงหมุดนั้นแน่นอน ไม่ใช่สถานที่สาธารณะที่ชื่อคล้ายกัน */
  const c = map.getCenter();
  const pinHits = findPins(s, c);

  if (!navigator.onLine) {
    // ออฟไลน์แต่ชื่อไซต์งานยังค้นได้ ถ้าเจอก็แสดงไปเลย อย่าเพิ่งบอกว่าทำไม่ได้
    if (pinHits.length) { showHits(pinHits, 'ไม่มีเน็ต — ค้นได้เฉพาะหมุดในแผนที่'); return; }
    fMsg('ตอนนี้ไม่มีเน็ต ค้นชื่อสถานที่ไม่ได้<br>' +
         'แต่วาง<b>พิกัด</b> <b>ลิงก์แผนที่</b> หรือค้น<b>ชื่อไซต์งานที่ตั้งไว้</b> ยังใช้ได้ตามปกติ');
    return;
  }

  // พิมพ์คำใหม่ทับระหว่างที่คำเก่ายังค้นไม่เสร็จ ต้องยกเลิกคำเก่า ไม่งั้นผลเก่ามาทับผลใหม่
  if (findAbort) findAbort.abort();
  findAbort = new AbortController();
  const sig = findAbort.signal;

  // เจอหมุดแล้วก็โชว์ไปก่อนเลย ไม่ต้องให้คนนั่งดู "กำลังค้น…" ทั้งที่ของที่เขาอยากได้พร้อมแล้ว
  if (pinHits.length) showHits(pinHits, 'กำลังค้นสถานที่เพิ่ม…');
  else fMsg('กำลังค้น…');

  /* ถามทั้งสองเจ้าพร้อมกัน แล้วเอาผลมารวมกัน
     ตอนแรกผมจะทำเป็น "ถาม OSM ก่อน ไม่เจอค่อยถาม Esri" แต่วัดแล้วใช้ไม่ได้
     เพราะคำที่ OSM ตอบผิด มันไม่ได้ตอบว่าง มันตอบผิดแบบมั่นใจ แล้ว Esri ก็ไม่ได้ถูกถามเลย
       "หมู่บ้านนันทวัน พระราม 9"  OSM ได้หมู่บ้านคนละชื่อที่นนทบุรี   Esri ได้ถูกที่สะพานสูง
       "999 ถนนพระราม 1"          OSM ได้ 999/9 ที่ใกล้ ๆ            Esri ได้ 999 ตรงเลขที่
     ถ้าถอยเฉพาะตอนว่าง สองคำนี้คนจะได้คำตอบผิดทั้งที่อีกเจ้ามีคำตอบถูกรออยู่

     แล้วทำไมไม่คัดด้วยคะแนนของ OSM — เพราะคัดไม่ได้จริง
     ค่า importance ของอันที่ถูก (แยกรัชโยธิน) ได้ 0.0001
     ส่วนอันที่ผิด (นันทวัน) ได้ 0.0534 คือสูงกว่า ตั้งเส้นแบ่งตรงไหนก็ตัดของถูกทิ้ง

     จึงเอามารวมกันแล้วให้คนเลือกเอง ซึ่งหน้านี้ออกแบบมาให้เลือกเองตั้งแต่ต้นอยู่แล้ว
     ไม่เคยเด้งไปอันดับหนึ่งอัตโนมัติ และขึ้นตำบล/อำเภอ/จังหวัดเต็ม ๆ ให้ดูทุกอัน
     คนเห็น "นนทบุรี" ก็รู้ทันทีว่าไม่ใช่ นี่คือสิ่งที่กันเรื่อง "ไม่กล้าเชื่อ" ได้จริง ไม่ใช่การคัดคะแนน

     ยิงพร้อมกันไม่ขัดเงื่อนไขของ OSM เพราะหนึ่งครั้งที่กด Enter คือหนึ่งคำขอต่อเจ้า
     ไม่ได้ยิงรัว และยังค้นตอนกด Enter เท่านั้นเหมือนเดิม */
  const [rOsm, rEsri] = await Promise.allSettled([
    askOSM(s, c, sig), askEsri(s, c, sig)
  ]);
  // ยกเลิกเพราะมีคำค้นใหม่มาทับ — ตัวที่ยกเลิกทำให้ sig.aborted เป็นจริง ไม่ต้องดู reason แยก
  if (sig.aborted) return;

  const okOsm  = rOsm.status  === 'fulfilled';
  const okEsri = rEsri.status === 'fulfilled';
  const failed = !okOsm && !okEsri;

  const credit = [okOsm  ? 'OpenStreetMap (ODbL)' : '', okEsri ? 'Esri' : '']
                   .filter(Boolean).join(' · ');
  const placeHits = mergePlaces(
    (okOsm  ? rOsm.value  : []),
    (okEsri ? rEsri.value : []),
    s
  );

  // ยิงไม่ออกทั้งสองเจ้าแต่มีหมุดที่ตรงอยู่แล้ว อย่าทิ้งของดีไปขึ้นข้อความผิดพลาด
  if (failed) {
    if (pinHits.length) { showHits(pinHits, 'ค้นสถานที่ไม่สำเร็จ — แสดงเฉพาะหมุดในแผนที่'); return; }
    fMsg('ค้นไม่สำเร็จ — เน็ตอาจหลุด ลองกดค้นอีกที');
    return;
  }

  if (!pinHits.length && !placeHits.length) {
    fMsg('ไม่เจอ "<b>' + esc(s) + '</b>"<br>' +
         'ลองใส่อำเภอหรือจังหวัดต่อท้าย เช่น "บางพลีใหญ่ สมุทรปราการ"<br>' +
         'ถ้าเป็นไซต์งานของเรา ให้ไปตั้งชื่อที่หมุดก่อน แล้วค้นด้วยชื่อนั้นจะเจอแน่นอน');
    return;
  }
  /* ได้ของมาแต่ไม่มีคำไหนที่พิมพ์ตรงกับชื่อที่ได้เลย — ต้องบอกตามจริงว่าไม่ใช่ของที่ตรง
     ลองพิมพ์มั่ว "กกกกกกกกกก" แล้วมันคืนมา 6 อันหน้าตาน่าเชื่อถือ ทั้งที่ไม่ได้เกี่ยวอะไรเลย
     ปล่อยให้ขึ้นเฉย ๆ คือหลอกคน ขึ้นคำเตือนคั่นไว้ให้เห็นก่อนจะกดอันไหน
     ถ้ามีหมุดของเราตรงอยู่แล้วก็ไม่ต้องเตือน เพราะของที่เขาอยากได้อยู่บนสุดให้แล้ว */
  const weak = placeHits.length && !pinHits.length && placeHits.every(p => !p.h);
  showHits(pinHits.concat(placeHits),
           weak ? 'ไม่เจอชื่อที่พิมพ์ตรง ๆ — ข้างล่างเป็นที่ใกล้เคียง ตรวจชื่อก่อนกด' : '',
           placeHits.length ? 'ผลค้นสถานที่จาก ' + credit : '');
}

/* รวมผลสองเจ้าเข้าด้วยกัน
   ------------------------------------------------------------
   สองเจ้ามักได้ที่เดียวกันแต่เขียนชื่อไม่เหมือนกัน เทียบชื่อเป็นข้อความจึงจับคู่ไม่ได้
     Esri: "ถนนพระรามที่ 1 เขตปทุมวัน กรุงเทพมหานคร 10330"
     OSM : "ถนนพระรามที่ 1, สยาม, แขวงปทุมวัน, เขตปทุมวัน, กรุงเทพมหานคร, 10330, ประเทศไทย"
   เลยเทียบด้วยระยะห่างแทน ใกล้กันกว่า 60 เมตรถือว่าที่เดียวกัน เอาอันเดียว
   60 เมตรมาจากขนาดหัวมุมถนนหนึ่งแห่ง แคบกว่านี้จะเหลือสองอันซ้ำ กว้างกว่านี้จะกินตึกข้างเคียง

   สลับเอาทีละเจ้า ไม่ใช่เรียงเจ้าหนึ่งให้หมดก่อน
   เพราะถ้าเอา OSM ให้หมดก่อน คำที่ OSM ตอบผิดจะดันของถูกจาก Esri ตกขอบหกอันดับไป

   แล้วเรียงด้วย "ตรงกับที่พิมพ์กี่คำ" ก่อน ค่อยเรียงด้วยระยะ
   เดิมเรียงด้วยระยะอย่างเดียว แล้วเจอปัญหาจริงสองข้อ
     ค้น "หมู่บ้านนันทวัน พระราม 9" — อันดับ 1 เป็น "หมู่บ้านกัสโต้ ราชพฤกษ์-พระราม 5" ที่นนทบุรี
       มันขึ้นก่อนเพราะมันใกล้กว่า 11.6 กม. ส่วนนันทวันตัวจริงที่สะพานสูงอยู่ 12.9 กม.
       คือของผิดชนะเพราะบังเอิญอยู่ใกล้ ซึ่งเป็นเรื่องที่คนบ่นว่า "ไม่กล้าเชื่อ" ตรง ๆ
     ค้น "999 ถนนพระราม 1" — "999 ถนนพระรามที่ 1" ที่ตรงเลขที่ตกไปอันดับ 5
       เพราะถนนพระราม 1 ช่วงอื่นที่ไม่มีเลขที่ 999 อยู่ใกล้จุดที่ดูกว่า
   นับคำที่ตรงช่วยทั้งสองข้อ เพราะ "นันทวัน" ไม่มีอยู่ในชื่อหมู่บ้านกัสโต้เลย
   และ "999" ไม่มีอยู่ในชื่อถนนเปล่า ๆ ระยะจึงถูกลดชั้นไปเป็นตัวตัดสินรอบสองแทน */
function mergePlaces(a, b, s) {
  const out = [];
  const far = p => out.every(q => map.distance(p.ll, q.ll) > 60);
  for (let i = 0; out.length < FIND_MAX && (i < a.length || i < b.length); i++) {
    if (i < a.length && far(a[i])) out.push(a[i]);
    if (out.length >= FIND_MAX) break;
    if (i < b.length && far(b[i])) out.push(b[i]);
  }

  /* ตัดคำด้วยช่องว่าง ไม่ได้ตัดคำไทยจริงจัง เพราะคนพิมพ์ค้นมักเว้นวรรคอยู่แล้ว
     เช่น "หมู่บ้านนันทวัน พระราม 9" ซึ่งเว้นตรงที่ควรเว้นพอดี
     ตัวตัดคำไทยจริงต้องมีพจนานุกรมเป็นร้อยกิโล ไม่คุ้มกับที่ได้เพิ่ม
     ทิ้งคำที่สั้นกว่า 2 ตัวอักษร เพราะ "1" หรือ "ก" ไปตรงกับอะไรก็ได้ จะกลายเป็นคะแนนลอย ๆ */
  const words = s.toLowerCase().split(/[\s,]+/).filter(w => w.length >= 2);
  const hit = p => {
    const t = (p.title || '').toLowerCase();
    return words.filter(w => t.includes(w)).length;
  };
  /* ติดจำนวนคำที่ตรงไว้กับผลแต่ละอันด้วย ไม่ได้ใช้แค่เรียงแล้วทิ้ง
     เพราะถ้าทุกอันได้ 0 แปลว่าไม่มีคำไหนที่พิมพ์ไปตรงกับชื่อที่ได้มาเลย
     runFind เอาไปขึ้นคำเตือนว่าเป็นของใกล้เคียง ไม่ใช่ของที่ตรง

     ไม่ตัดของที่ได้ 0 ทิ้ง เพราะบางทีมันถูกจริง ๆ แต่เขาใช้ชื่อใหม่
     เช่นค้น "ถนนบางนา-ตราด" OSM คืน "ถนนเทพรัตน" ซึ่งคือถนนเส้นเดียวกันที่เปลี่ยนชื่อ
     ตัดทิ้งคือทิ้งคำตอบที่ถูก บอกว่าไม่แน่ใจแล้วให้คนดูเองปลอดภัยกว่า */
  return out
    .map(p => Object.assign(p, { h: hit(p) }))
    .sort((x, y) => y.h - x.h || x.m - y.m);
}

/* ถาม OpenStreetMap
   ------------------------------------------------------------
   สามตัวนี้ขาดไม่ได้ ตอนแรกผมทดสอบโดยไม่ใส่แล้วสรุปผิดว่า OSM ใช้กับภาษาไทยไม่ได้
     countrycodes=th    ตัดผลนอกประเทศออก ไม่ใส่แล้วชื่อซ้ำกับที่อื่นในโลกจะแย่งอันดับ
     accept-language=th คืนชื่อเป็นไทย ไม่ใส่แล้วได้ชื่อโรมันที่คนอ่านไม่ออกว่าที่ไหน
     viewbox            ถ่วงน้ำหนักไปทางที่กำลังดูอยู่ แบบเดียวกับ location ของ Esri
   viewbox ไม่ได้ใส่ bounded=1 ด้วย — ถ่วงน้ำหนักพอ ไม่ใช่บังคับตัด
   ถ้าบังคับตัด คนที่ดูกรุงเทพแล้วค้นที่ระยองจะหาไม่เจอทั้งที่มีอยู่ */
async function askOSM(s, c, sig) {
  const b = map.getBounds();
  const url = OSM_URL + '?format=jsonv2&limit=10&countrycodes=th&accept-language=th'
            + '&viewbox=' + [b.getWest(), b.getNorth(), b.getEast(), b.getSouth()]
                              .map(n => n.toFixed(4)).join(',')
            + '&q=' + encodeURIComponent(s);
  const r = await fetch(url, { signal: sig });
  if (!r.ok) throw new Error('HTTP ' + r.status);
  const d = await r.json();

  const seen = new Set();
  return (Array.isArray(d) ? d : [])
    .filter(x => x && isFinite(+x.lat) && isFinite(+x.lon))
    .filter(x => { const k = x.display_name || ''; if (seen.has(k)) return false; seen.add(k); return true; })
    .map(x => ({
      kind:  'place',
      ll:    L.latLng(+x.lat, +x.lon),
      /* OSM ต่อท้ายทุกชื่อด้วย ", ประเทศไทย" ซึ่งไม่ได้บอกอะไรเลย
         เพราะ countrycodes=th กรองให้เหลือแต่ในไทยอยู่แล้ว ทุกบรรทัดจึงลงท้ายเหมือนกันหมด
         ตัดออกให้ชื่อสั้นลง รายการหกอันจะได้ไม่ยาวจนต้องเลื่อนดู */
      title: String(x.display_name || '').replace(/,\s*ประเทศไทย\s*$/, ''),
      /* OSM ส่งขอบเขตมาเป็น [ใต้, เหนือ, ตก, ออก] เป็นข้อความ
         แปลงให้เป็นรูปเดียวกับที่ Esri ส่ง เพื่อให้ goTo ใช้ตัวเดิมได้ไม่ต้องแยกทาง */
      ext:   Array.isArray(x.boundingbox) && x.boundingbox.length === 4
               ? { ymin:+x.boundingbox[0], ymax:+x.boundingbox[1],
                   xmin:+x.boundingbox[2], xmax:+x.boundingbox[3] } : null,
      m:     map.distance(c, L.latLng(+x.lat, +x.lon))
    }))
    .sort((a, b2) => a.m - b2.m)
    .slice(0, FIND_MAX);
}

/* ถาม Esri — เก่งเรื่องบ้านเลขที่ตรง ๆ และชื่อหมู่บ้านจัดสรร ซึ่งเป็นจุดอ่อนของ OSM */
async function askEsri(s, c, sig) {
  const url = GEOCODE_URL + '?f=json&countryCode=THA&maxLocations=10'
            + '&location=' + c.lng.toFixed(4) + ',' + c.lat.toFixed(4)
            + '&SingleLine=' + encodeURIComponent(s);
  const r = await fetch(url, { signal: sig });
  if (!r.ok) throw new Error('HTTP ' + r.status);
  const d = await r.json();

  const seen = new Set();
  return (d.candidates || [])
    .filter(x => x && x.location && isFinite(x.location.y) && x.score >= FIND_MIN_SCORE)
    .filter(x => { const k = x.address || ''; if (seen.has(k)) return false; seen.add(k); return true; })
    .map(x => ({
      kind:  'place',
      ll:    L.latLng(x.location.y, x.location.x),
      title: x.address,
      ext:   x.extent,
      m:     map.distance(c, L.latLng(x.location.y, x.location.x))
    }))
    .sort((a, b2) => a.m - b2.m)
    .slice(0, FIND_MAX);
}

/* ค้นชื่อไซต์งานที่ตั้งไว้ที่หมุด
   ใช้วิธีดูว่าคำที่พิมพ์อยู่ในชื่อหรือเปล่าแบบตรง ๆ ไม่ได้ทำให้ฉลาดกว่านั้น
   เพราะชื่อพวกนี้คนของเราตั้งเอง เขาจำได้อยู่แล้วว่าตั้งว่าอะไร
   ตัวที่ขึ้นต้นด้วยคำที่พิมพ์ให้มาก่อน แล้วค่อยเรียงตามระยะใกล้จุดที่กำลังดู */
function findPins(s, c) {
  const q = s.toLowerCase();
  return pins
    .filter(p => p.n && p.n.toLowerCase().includes(q))
    .map(p => ({
      kind:  'pin',
      id:    p.id,
      ll:    L.latLng(p.lat, p.lng),
      title: p.n,
      sub:   LV[p.k] ? LV[p.k].label : '',
      head:  p.n.toLowerCase().startsWith(q) ? 0 : 1,
      m:     map.distance(c, L.latLng(p.lat, p.lng))
    }))
    .sort((a, b) => a.head - b.head || a.m - b.m)
    .slice(0, FIND_MAX);
}

/* วาดรายการผล — หมุดของเรากับสถานที่สาธารณะใช้กล่องเดียวกันแต่ต้องแยกออกด้วยตา
   ไม่งั้นคนจะไม่รู้ว่าอันไหนคือของที่เราบันทึกไว้เอง (เชื่อได้) อันไหนคือของที่เดามาจากแผนที่โลก */
function showHits(list, note, credit) {
  findHits = list;
  fRes.innerHTML =
    (note ? '<div class="fr msg">' + note + '</div>' : '') +
    list.map((r, i) =>
      '<div class="fr' + (r.kind === 'pin' ? ' pin' : '') + '" data-i="' + i + '">' +
        (r.kind === 'pin' ? '<span class="tag">หมุด</span>' : '') + esc(r.title) +
        '<div class="d">' + esc([r.sub, distTxt(r.m)].filter(Boolean).join(' · ')) + '</div>' +
      '</div>').join('') +
    (credit ? '<div class="fr cred">' + esc(credit) + '</div>' : '');
  fRes.classList.add('show');
}

/* ---------- ต่อสายปุ่มต่าง ๆ ---------- */
fRes.addEventListener('click', e => {
  const row = e.target.closest('.fr[data-i]');
  if (!row) return;
  const r = findHits[+row.dataset.i];
  if (!r) return;
  /* ผลที่เป็นหมุดของเราไม่ต้องปักหมุดดำทับ ตัวหมุดจริงอยู่ตรงนั้นอยู่แล้ว
     ปักทับจะได้หมุดสองอันซ้อนกันและบังหมุดจริงที่เป็นตัวบอกความยาว
     เปิดป๊อปอัปของมันแทน คนจะได้เห็นทั้งชื่อ ความยาว และปุ่มแก้ไขในครั้งเดียว */
  if (r.kind === 'pin') {
    clearFindMarker();
    fHide();
    flyAndLand(r.ll, null);
    const m = layers[r.id];
    if (m) setTimeout(() => m.openPopup(), 900);
    return;
  }
  goTo(r.ll, r.title, r.ext);
});

// ค้นตอนกด Enter หรือกดแว่นขยายเท่านั้น ไม่ค้นทุกตัวอักษรที่พิมพ์
// หน้านี้ทั้งหน้าเป็นงานลดจำนวนคำขอ จะมาเพิ่มคำขอทุกการกดแป้นก็ขัดกันเอง
fQ.addEventListener('keydown', e => {
  if (e.key === 'Enter') { e.preventDefault(); fQ.blur(); runFind(); }
  else if (e.key === 'Escape') { fQ.value = ''; fClear.hidden = true; fHide(); fQ.blur(); }
});
fQ.addEventListener('input', () => { fClear.hidden = !fQ.value; });
fGo.addEventListener('click', () => { fQ.blur(); runFind(); });
fClear.addEventListener('click', () => {
  fQ.value = ''; fClear.hidden = true; fHide(); clearFindMarker(); fQ.focus();
});

/* กล่องค้นหาลอยอยู่บนแผนที่ ถ้าไม่กั้นไว้ การคลิก/ลาก/หมุนล้อในกล่องจะทะลุไปถึงแผนที่
   ผลคือเลื่อนตัวหนังสือในช่องแล้วแผนที่เลื่อนตาม หรือแย่กว่านั้นคือได้หมุดที่ไม่ได้ตั้งใจ */
L.DomEvent.disableClickPropagation(document.getElementById('find'));
L.DomEvent.disableScrollPropagation(document.getElementById('find'));
// แตะที่แผนที่ = ปิดรายการผล แต่ไม่ลบที่หมายทิ้ง คนยังต้องใช้มันเล็งอยู่
map.on('click', fHide);

setInterval(poll, 15000);
// กลับมาที่แท็บนี้แล้วเห็นของเก่าค้างอยู่ 15 วินาทีมันนาน ดึงใหม่ทันทีเลย
window.addEventListener('focus', poll);
document.addEventListener('visibilitychange', () => { if (!document.hidden) poll(); });

// ให้เว็บหลักเรียกได้ตอนสลับมาที่แท็บแผนที่
// Leaflet ที่อยู่ใน div ซ่อนอยู่จะคิดว่าตัวเองกว้าง 0 ไทล์เลยไม่โหลด ต้องบอกให้วัดขนาดใหม่
// refreshPerm: เรียกตอนรู้สิทธิ์ของคนที่ล็อกอินแล้ว (เว็บหลักรู้ role ช้ากว่าโหลดหน้า)
window.PILEMAP = {
  show: function () { map.invalidateSize(); applyEditMode(); poll(); },
  reload: poll,
  refreshPerm: applyEditMode
};
</script>
</body>
</html>
