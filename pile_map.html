<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
<title>แผนที่หมุดสี — ความยาวเสาเข็ม (เก็บบน Supabase)</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
<style>
  :root { --bar-h:48px; --ink:#1b3a5c; }
  * { box-sizing:border-box; }
  html, body { height:100%; margin:0; }
  body {
    font-family:-apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans Thai", "Sarabun", sans-serif;
    color:#222; overflow:hidden;
  }
  .leaflet-container, .leaflet-popup-content { font-family:inherit; }

  /* ---------- แถบบน (ซ่อนอัตโนมัติ) ----------
     ลอยทับแผนที่ ไม่ได้กินพื้นที่ แผนที่เลยได้เต็มจอ
     ปกติหุบขึ้นไปพ้นจอ เอาเมาส์ชี้ขอบบนถึงจะไหลลงมา เหมือนแถบงานที่ตั้งให้ซ่อนไว้
     จอสัมผัสไม่มีการ "ชี้" เลยต้องมีหูจับให้แตะเรียก (ดู #barHandle) */
  #bar { position:fixed; top:0; left:0; right:0; z-index:1200;
         height:var(--bar-h); display:flex; align-items:center; gap:10px; padding:0 12px;
         background:var(--ink); color:#fff; font-size:13px;
         transform:translateY(-100%); transition:transform .18s ease; }
  #bar.show { transform:none; }

  /* หูจับ: ขีดสั้น ๆ กลางขอบบน สูง 14px กินที่แทบไม่รู้สึก
     มีไว้เพราะถ้าซ่อนสนิท คนเปิดครั้งแรกจะไม่มีทางรู้ว่ามีแถบซ่อนอยู่ตรงไหน
     พอแถบเลื่อนลงมา หูจับจะเลื่อนตามไปอยู่ใต้แถบ กลายเป็นปุ่มปิด */
  #barHandle { position:fixed; top:0; left:50%; margin-left:-23px; z-index:1199;
               width:46px; height:14px; border-radius:0 0 8px 8px; cursor:pointer;
               background:rgba(27,58,92,.5); backdrop-filter:blur(2px);
               display:flex; align-items:center; justify-content:center;
               transition:top .18s ease, background .18s; }
  #barHandle::before { content:''; width:18px; height:2px; border-radius:2px;
                       background:rgba(255,255,255,.85); }
  #barHandle:hover { background:rgba(27,58,92,.88); }
  #bar.show ~ #barHandle { top:var(--bar-h); }
  #bar h1 { font-size:14px; font-weight:600; margin:0; white-space:nowrap; }
  #bar .spacer { flex:1; }
  #bar select, #bar button {
    font:inherit; font-size:12px; border-radius:6px; border:1px solid rgba(255,255,255,.3);
    background:rgba(255,255,255,.12); color:#fff; padding:5px 10px; cursor:pointer;
  }
  #bar button:hover, #bar select:hover { background:rgba(255,255,255,.22); }
  #bar button:disabled { opacity:.35; cursor:default; }
  #bar button:disabled:hover { background:rgba(255,255,255,.12); }
  #bar select option { color:#222; }
  #count { opacity:.75; font-size:12px; white-space:nowrap; }

  /* ---------- ไฟบอกสถานะการซิงค์ ----------
     ข้อมูลไม่ได้อยู่ในเครื่องแล้ว ถ้าบันทึกไม่ขึ้นต้องรู้ทันที
     ไม่ใช่มารู้ตอนเปิดใหม่แล้วหมุดหาย */
  #sync { font-size:11.5px; white-space:nowrap; display:flex; align-items:center; gap:5px;
          padding:4px 9px; border-radius:12px; background:rgba(255,255,255,.12); cursor:default; }
  #sync .dot { width:7px; height:7px; border-radius:50%; background:#8ac926; flex:none; }
  #sync.saving .dot { background:#ffd21f; }
  #sync.bad    { background:rgba(224,30,38,.35); cursor:pointer; }
  #sync.bad .dot { background:#ff6b6b; }

  /* ---------- แผนที่ ---------- */
  /* top:0 เพราะแถบบนลอยทับแล้ว ไม่ได้เบียดที่ของแผนที่อีกต่อไป */
  #map { position:absolute; top:0; left:0; right:0; bottom:0; background:#dfe6ec; }
  /* เคอร์เซอร์คือตัวบอกโหมด: กากบาท = คลิกแล้วได้หมุด, มือ = คลิกแล้วไม่ได้อะไร
     ไม่ต้องมีข้อความอธิบาย เห็นจากหางตาได้เลยว่าตอนนี้ปักอยู่หรือเปล่า */
  #map.leaflet-container { cursor:grab; }
  #map.pinning.leaflet-container { cursor:crosshair; }
  #map.leaflet-container.leaflet-drag-target { cursor:grabbing; }
  .leaflet-interactive { cursor:pointer; }
  /* แผนที่เริ่มที่ขอบบนแล้ว ปุ่มซูมเลยไปอยู่ใต้แถบบนพอดี ตอนแถบไหลลงมาจะทับจนกดปุ่ม + ไม่ได้
     ดันลงมาเท่าความสูงแถบ ปุ่มเลยอยู่พ้นกันตลอด ไม่ว่าแถบจะหุบหรือกาง */
  .leaflet-top.leaflet-left { margin-top:var(--bar-h); }

  /* ---------- ตารางสี ---------- */
  #legend {
    position:absolute; left:12px; bottom:18px; z-index:900; width:232px;
    background:rgba(255,255,255,.96); border-radius:10px; padding:8px;
    box-shadow:0 2px 12px rgba(0,0,0,.22); font-size:13px;
    -webkit-user-select:none; user-select:none;
    /* ตอนนี้เพิ่มสีได้ไม่จำกัด ถ้าไม่กันไว้ ใส่สักสิบกว่าสีตารางจะสูงเลยขอบจอ
       จำกัดความสูงแล้วให้เลื่อนในตัวแทน
       ไม่ต้องเผื่อความสูงแถบบนแล้วเพราะมันซ่อนอยู่ แต่ยังเว้นขอบบนไว้ให้พ้นหูจับ */
    display:flex; flex-direction:column;
    max-height:calc(100vh - 54px);
  }
  #legend.hidden { display:none; }
  #levels { overflow-y:auto; overscroll-behavior:contain; }
  /* flex:none กันหัวตาราง ปุ่มเพิ่มสี และบรรทัดคำอธิบายถูกบีบ
     ตอนรายการสียาวจนต้องเลื่อน — ให้ส่วนที่หดคือรายการสีเท่านั้น */
  .lgd-head { display:flex; align-items:center; gap:4px; padding:0 2px 6px 6px; flex:none; }
  .lgd-head .ttl { font-size:11px; font-weight:600; color:#67798c; flex:1; white-space:nowrap; }
  /* #8a96a3 บนพื้นขาวจางจนแทบมองไม่เห็นในภาพหน้าจอ และลูกศรหุบคือสวิตช์เปิด-ปิด
     การปักหมุด ไม่ใช่ปุ่มรอง เลยต้องหาเจอง่าย — ใช้ #5a6b7c ซึ่งเข้มพอเห็นชัด
     แต่ยังไม่แย่งความสนใจไปจากตัวสีในตาราง */
  .lgd-head button, #legendOpen {
    font:inherit; border:none; background:none; cursor:pointer; color:#5a6b7c;
    border-radius:6px; line-height:1; font-size:14px;
  }
  /* วัดแล้วตอนแรกปุ่มได้พื้นที่กดแค่ 21x17 และ 16x17 px ซึ่งเล็กเกินจะกดโดนด้วยนิ้ว
     ขยายเป็น 30x26 โดยเพิ่ม padding ไม่ใช่เพิ่มขนาดไอคอน หน้าตาเลยไม่หนักขึ้น */
  .lgd-head button { padding:6px 8px; min-width:30px; }
  .lgd-head button:hover { background:#eef2f6; color:var(--ink); }
  .lgd-head button.on { background:var(--ink); color:#fff; }

  .lv { display:flex; align-items:center; gap:8px; padding:5px 8px; border-radius:7px;
        cursor:pointer; border:2px solid transparent; line-height:1.2; }
  .lv:hover { background:#eef2f6; }
  /* สีที่เลือกอยู่ต้องเด่น เพราะมันกำหนดว่าคลิกถัดไปจะได้หมุดสีอะไร */
  .lv.on { background:#e8f0fa; border-color:var(--ink); font-weight:600; }
  .sw { width:16px; height:16px; border-radius:50%; border:2px solid #fff;
        box-shadow:0 0 0 1px rgba(0,0,0,.35); flex:none; }
  .lv .nm { white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .lv .n { margin-left:auto; font-size:11px; color:#8a96a3; min-width:16px; text-align:right; }
  .lv.on .n { color:var(--ink); }

  /* ---------- โหมดตั้งค่า ---------- */
  .lv.edit { cursor:default; gap:6px; padding:4px 6px; }
  .lv.edit:hover { background:none; }
  /* input type=color ปกติเป็นสี่เหลี่ยมมีกรอบหนา ปรับให้เป็นวงกลมเท่าหมุดจริง
     จะได้เห็นทันทีว่าสีที่เลือกจะออกมาหน้าตาแบบไหนบนแผนที่ */
  .ec { width:22px; height:22px; flex:none; padding:0; border:none; border-radius:50%;
        background:none; cursor:pointer; -webkit-appearance:none; appearance:none; }
  .ec::-webkit-color-swatch-wrapper { padding:0; }
  .ec::-webkit-color-swatch { border:2px solid #fff; border-radius:50%;
                              box-shadow:0 0 0 1px rgba(0,0,0,.35); }
  .ec::-moz-color-swatch { border:2px solid #fff; border-radius:50%; }
  .et { flex:1; min-width:0; font:inherit; font-size:12px; padding:4px 6px;
        border:1px solid #d6dde4; border-radius:5px; background:#fff; }
  .et:focus { outline:none; border-color:var(--ink); }
  .ed { flex:none; font:inherit; font-size:15px; line-height:1; color:#b8c2cc; cursor:pointer;
        border:none; background:none; padding:2px 4px; border-radius:5px; }
  .ed:hover { background:#fdeaea; color:#b03030; }

  #addLevel { display:none; flex:none; width:100%; font:inherit; font-size:12px; margin-top:4px;
              padding:6px; border:1px dashed #c3ccd5; background:#fff; color:#5a6b7c;
              border-radius:7px; cursor:pointer; }
  #addLevel:hover { border-color:var(--ink); color:var(--ink); background:#f3f7fb; }
  #legend.editing #addLevel { display:block; }

  #legend .hint { font-size:11px; color:#8a96a3; padding:6px 6px 0; flex:none;
                  border-top:1px solid #e7ecf1; margin-top:6px; line-height:1.5; }

  /* ---------- ปุ่มตอนหุบ ---------- */
  /* ตอนหุบต้องยังบอกได้ว่า "ตอนนี้คลิกแล้วไม่ปักหมุดนะ" เลยเขียนไว้บนปุ่มเลย
     ไม่ใช่แค่ไอคอนลูกศรเปล่า ๆ ที่ต้องเดาเอง */
  #legendOpen {
    position:absolute; left:12px; bottom:18px; z-index:900;
    background:rgba(255,255,255,.96); box-shadow:0 2px 12px rgba(0,0,0,.22);
    padding:8px 12px; border-radius:10px; font-size:12.5px; color:#5a6b7c;
    display:none; align-items:center; gap:7px;
  }
  #legendOpen.show { display:flex; }
  #legendOpen:hover { color:var(--ink); }
  #legendOpen .sw { width:13px; height:13px; }

  /* ---------- ป๊อปอัปหมุด ---------- */
  .leaflet-popup-content { margin:10px 12px; font-size:13px; }
  .pp-now { display:flex; align-items:center; gap:7px; font-weight:600; margin-bottom:8px; }
  .pp-lbl { font-size:11px; color:#8a96a3; margin-bottom:4px; }
  .pp-row { display:flex; gap:5px; margin-bottom:9px; flex-wrap:wrap; max-width:190px; }
  /* ชื่อไซต์งานของหมุด */
  .pp-nm  { font-weight:700; font-size:13.5px; margin-bottom:6px; }
  .pp-nin { font:inherit; font-size:13px; width:100%; box-sizing:border-box; margin-bottom:9px;
            padding:6px 8px; border:1px solid #d7e0ea; border-radius:7px; outline:none; }
  .pp-nin:focus { border-color:#15803d; }
  .pp-c { width:22px; height:22px; border-radius:50%; border:2px solid #fff; cursor:pointer;
          box-shadow:0 0 0 1px rgba(0,0,0,.3); padding:0; }
  .pp-c.on { box-shadow:0 0 0 2px var(--ink); }
  .pp-del { font:inherit; font-size:12px; width:100%; padding:5px; cursor:pointer;
            border:1px solid #e3b4b4; background:#fff6f6; color:#b03030; border-radius:6px; }
  .pp-del:hover { background:#fdeaea; }

  /* ---------- ช่องค้นหา ----------
     วางขวาบน เพราะซ้ายบนเป็นปุ่มซูม ล่างซ้ายเป็นตารางสี ล่างขวาเป็นสวิตช์ปักหมุด
     ดันลงมาเท่าความสูงแถบบนเหมือนปุ่มซูม จะได้ไม่โดนแถบทับตอนมันไหลลงมา */
  #find { position:absolute; top:calc(var(--bar-h) + 10px); right:12px; z-index:1000; width:272px; }
  #find .fbox { display:flex; align-items:center; background:rgba(255,255,255,.96);
                border-radius:10px; box-shadow:0 2px 12px rgba(0,0,0,.22); overflow:hidden; }
  #findQ { flex:1; min-width:0; font:inherit; font-size:13px; color:#222;
           border:0; outline:none; background:none; padding:10px 4px 10px 12px; }
  #findQ::placeholder { color:#9aa7b4; }
  #find .fbtn { flex:none; font:inherit; font-size:14px; line-height:1; cursor:pointer;
                border:0; background:none; color:#5a6b7c; padding:10px 11px; }
  #find .fbtn:hover { color:var(--ink); }
  #find .fbtn[hidden] { display:none; }
  #findRes { display:none; margin-top:6px; background:rgba(255,255,255,.97);
             border-radius:10px; box-shadow:0 2px 12px rgba(0,0,0,.22);
             max-height:46vh; overflow-y:auto; overscroll-behavior:contain; }
  #findRes.show { display:block; }
  .fr { padding:9px 12px; font-size:13px; line-height:1.45; cursor:pointer;
        border-bottom:1px solid #eef2f6; }
  .fr:last-child { border-bottom:0; }
  .fr:hover { background:#eef2f6; }
  .fr .d { font-size:11px; color:#8a96a3; margin-top:2px; }
  /* บรรทัดบอกสถานะ (กำลังค้น / ไม่เจอ / ไม่มีเน็ต) ใช้กล่องเดียวกับผลลัพธ์
     ไม่ใช้ #toast เพราะ toast ลอยอยู่กลางบน ทับกล่องนี้พอดีตอนจอแคบ */
  .fr.msg { cursor:default; color:#64748b; font-size:12.5px; }
  /* หมุดของเรากับสถานที่จากแผนที่โลกอยู่ในรายการเดียวกัน ต้องดูออกว่าอันไหนเป็นอันไหน
     ของเราเชื่อได้เพราะคนของเราปักเอง ส่วนของแผนที่โลกเป็นการเดาที่อาจผิด */
  .fr.pin { background:#f2f9f4; border-left:3px solid #15803d; }
  .fr .tag { display:inline-block; font-size:10.5px; font-weight:700; color:#15803d;
             background:#dcf0e3; border-radius:4px; padding:1px 5px; margin-right:6px;
             vertical-align:1px; }
  .fr.msg:hover { background:none; }
  .fr.msg b { color:var(--ink); font-weight:600; }
  /* บรรทัดบอกว่าผลมาจากใคร — ไม่ใช่ของประดับ เงื่อนไขการใช้ฟรีของ OpenStreetMap
     บังคับให้แสดงที่มาเมื่อเอาข้อมูลเขามาใช้ ตัวเล็กได้ แต่ซ่อนไม่ได้ */
  .fr.cred { cursor:default; color:#a3adb8; font-size:10.5px; padding:5px 12px 7px;
             background:#fafbfc; }
  .fr.cred:hover { background:#fafbfc; }

  /* หมุดของผลค้นหาทำเป็นหยดน้ำ ไม่ใช่วงกลม
     เพราะหมุดเสาเข็มเป็นวงกลมสีหมดแล้ว ถ้าใช้วงกลมด้วยจะแยกไม่ออกว่าอันไหนของจริง
     อันนี้เป็นแค่ที่หมายชั่วคราว ไม่ได้บันทึกขึ้นเซิร์ฟเวอร์ */
  .fmk { width:19px; height:19px; background:#111827; border:3px solid #fff;
         border-radius:50% 50% 50% 0; transform:rotate(-45deg);
         box-shadow:0 2px 7px rgba(0,0,0,.45); }

  /* ---------- ข้อความแจ้งชั่วคราว ---------- */
  #toast { position:absolute; left:50%; transform:translateX(-50%); top:calc(var(--bar-h) + 12px);
           z-index:1000; background:rgba(27,58,92,.94); color:#fff; font-size:12.5px;
           padding:7px 14px; border-radius:16px; pointer-events:none;
           opacity:0; transition:opacity .18s; }
  #toast.show { opacity:1; }

  @media (max-width:640px) {
    #bar h1 { display:none; }
    #legend, #legendOpen { bottom:12px; left:8px; }
    /* กว้างเต็มจอไม่ได้ ปุ่มซูมอยู่ซ้ายบนระดับเดียวกัน กว้างราว 34px เริ่มที่ขอบ 10px
       เริ่มที่ 54px เลยพ้นปุ่มซูมพอดีโดยไม่ต้องย้ายปุ่มซูมหนีไปไหน */
    #find { left:54px; right:8px; width:auto; }
  }

  /* ---------- สวิตช์ปักหมุด (โผล่เฉพาะจอสัมผัส) ----------
     เมาส์แยก "คลิก" กับ "ลาก" ออกจากกันได้ชัด นิ้วไม่ชัดแบบนั้น
     นิ้วที่ตั้งใจเลื่อนแผนที่แต่ขยับไม่ถึงเกณฑ์ลาก จะถูกนับเป็นแตะ = ได้หมุดที่ไม่ได้ตั้งใจ
     เลยให้กดสวิตช์ก่อนถึงจะปักได้ ปกติปิดไว้ แผนที่จึงเลื่อนได้โดยไม่ต้องระวัง
     อยู่มุมขวาล่าง เพราะตารางสีอยู่ซ้ายล่าง และนิ้วโป้งเอื้อมถึงง่ายที่สุด */
  #pinArm { position:fixed; right:12px; bottom:12px; z-index:1100;
            display:none; align-items:center; gap:8px;
            padding:12px 16px; border:0; border-radius:999px;
            font-size:14px; font-weight:700; color:#fff; cursor:pointer;
            font-family:inherit; -webkit-tap-highlight-color:transparent;
            background:rgba(27,58,92,.85); backdrop-filter:blur(3px);
            box-shadow:0 3px 12px rgba(0,0,0,.32); }
  #pinArm.show { display:flex; }
  #pinArm.on { background:#15803d; }
  /* วงกลมโชว์สีที่กำลังจะปัก จะได้ไม่ต้องกวาดตาไปดูตารางสีอีกฝั่ง */
  #pinArm .sw { width:15px; height:15px; border-radius:50%;
                border:2px solid rgba(255,255,255,.9); background:transparent; }

</style>
</head>
<body>

<div id="bar">
  <h1>แผนที่หมุดสี — ความยาวเสาเข็ม</h1>
  <span id="count">ยังไม่มีหมุด</span>
  <span class="spacer"></span>
  <span id="sync" title="ข้อมูลเก็บบน Supabase"><span class="dot"></span><span class="tx">กำลังโหลด…</span></span>
  <button id="undo" disabled title="ย้อนการแก้ไขล่าสุด">เลิกทำ</button>
  <button id="clear" title="ลบหมุดทั้งหมด">ล้างหมุด</button>
</div>

<script>
'use strict';

/* ค่าพวกนี้เป็น "ความชอบของเครื่องนี้" ไม่ใช่ข้อมูลงาน
   เปิดคอมที่ออฟฟิศค้างไว้ตรงไซต์งาน เปิดที่บ้านค้างไว้อีกที่ ก็ควรต่างกันได้
   เลยยังเก็บในเครื่องเหมือนเดิม ไม่ต้องขึ้นเซิร์ฟเวอร์ */
const VIEW_KEY = 'pile_view_v2';
const OPEN_KEY = 'pile_legend_open_v2';

/* ============================================================
   ที่เก็บข้อมูล: Supabase (ไม่ใช่เครื่องนี้แล้ว)
   ------------------------------------------------------------
   หลักคิดสามข้อ
   1) หน้าจอไม่รอเน็ต — คลิกแล้วหมุดขึ้นทันที แล้วค่อยส่งขึ้นเซิร์ฟเวอร์เบื้องหลัง
   2) ส่งไม่ขึ้นก็ไม่ลบงานที่เพิ่งทำทิ้ง — ขึ้นไฟแดงบอกแล้วลองใหม่เรื่อย ๆ
      (เคยคิดจะย้อนสถานะกลับเวลาส่งพลาด แต่นั่นคือหมุดที่เพิ่งปักหายไปหน้าต่อหน้า
       ซึ่งแย่กว่าการค้างไว้แล้วบอกให้รู้ว่ายังไม่ได้บันทึก)
   3) โหลดครั้งแรกไม่สำเร็จ = ห้ามเขียนอะไรขึ้นไปเลย
      เพราะถ้าเขียน เราจะเอาค่าตั้งต้นในโค้ดไปทับตารางสีจริงที่แก้ไว้บนเซิร์ฟเวอร์
   ============================================================ */
const SUPA = {
  url:    'https://dmxegqmhxarabyqduikb.supabase.co',
  key:    'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImRteGVncW1oeGFyYWJ5cWR1aWtiIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODcxMTA2NjksImV4cCI6MjEwMjY4NjY2OX0.R1NyeKfVmjnp48zGHdMeB6XsChlHd8N5KD67k8RTWI8',
  schema: 'sud',
  group:  'default'     // เผื่ออนาคตอยากแยกแผนที่ตามโครงการ
};

const nowISO = () => new Date().toISOString();

// รายการค่าสำหรับ ?col=in.(...) — ใส่อัญประกาศไว้ กันคีย์ที่มีอักขระแปลก ๆ ทำ query เพี้ยน
const inList = arr => 'in.(' + arr.map(v => '"' + String(v).replace(/"/g, '') + '"').join(',') + ')';

async function rest(path, opt) {
  opt = opt || {};
  const h = {
    apikey: SUPA.key,
    Authorization: 'Bearer ' + SUPA.key,
    // สคีมา sud ไม่ใช่ public ถ้าไม่บอกสองหัวข้อนี้ PostgREST จะหาตารางไม่เจอ
    'Accept-Profile':  SUPA.schema,
    'Content-Profile': SUPA.schema
  };
  if (opt.body)   h['Content-Type'] = 'application/json';
  if (opt.prefer) h.Prefer = opt.prefer;

  const r = await fetch(SUPA.url + '/rest/v1/' + path, {
    method:  opt.method || 'GET',
    headers: h,
    body:    opt.body ? JSON.stringify(opt.body) : undefined
  });
  const txt = await r.text();
  if (!r.ok) throw new Error('HTTP ' + r.status + ' ' + txt.slice(0, 180));
  return txt ? JSON.parse(txt) : null;
}

/* ---------- ดูอย่างเดียว หรือ แก้ได้ ----------
   เว็บหลักมีระบบสิทธิ์อยู่แล้ว เลยให้มันเป็นคนบอกว่าคนที่เปิดอยู่แก้ได้มั้ย
   ผ่าน window.PILEMAP_CANEDIT (ใส่เป็นค่าหรือฟังก์ชันก็ได้)
   เปิดไฟล์นี้เดี่ยว ๆ ไม่มีใครตั้งค่าไว้ = แก้ได้ เพราะคนที่เปิดไฟล์ตรง ๆ คือเจ้าของเครื่อง

   นี่เป็นแค่การซ่อนปุ่ม ไม่ใช่การป้องกันจริง — anon key เปิดสิทธิ์เขียนให้ทุกคนอยู่แล้ว
   ใครเปิด view-source ก็ยิง API เองได้ ตัวนี้มีไว้กันกดพลาด ไม่ได้มีไว้กันคนตั้งใจ */
let canEdit = true;
function resolveCanEdit() {
  try {
    const v = window.PILEMAP_CANEDIT;
    if (v !== undefined) return !!(typeof v === 'function' ? v() : v);
    // สำรอง: ?edit=0/1 ใน URL เผื่อเว็บหลักเขียนค่าเข้ามาในหน้านี้ไม่ได้
    // (เบราว์เซอร์กันการคุยข้ามกรอบตอนเปิดจากไฟล์ในเครื่อง)
    const q = new URLSearchParams(location.search);
    if (q.has('edit')) return q.get('edit') !== '0';
    return true;
  } catch (e) { return false; }
}

// อีเมลคนปัก เอาไว้ไล่ดูย้อนหลังว่าหมุดไหนใครทำ
// ตอนอยู่ในเว็บหลักจะมีคนล็อกอินอยู่ ตอนเปิดไฟล์นี้เดี่ยว ๆ ไม่มี ก็ปล่อยว่าง
function whoami() {
  try {
    const u = window.PILEMAP_USER;
    const v = typeof u === 'function' ? u() : u;
    return v ? String(v).slice(0, 120) : null;
  } catch (e) { return null; }
}

/* ชื่อหมุด เก็บลงคอลัมน์ note ที่มีอยู่แล้วในตาราง ไม่ต้องแก้โครงฐานข้อมูล
   ทำให้เป็นข้อความเสมอ ห้ามปล่อยเป็น null — เพราะตัวเทียบว่า "มีอะไรเปลี่ยนไหม"
   ใช้ JSON.stringify เทียบกันตรง ๆ ถ้าบางรอบเป็น null บางรอบเป็น "" มันจะนับว่าต่าง
   แล้วจะยิงบันทึกขึ้นเซิร์ฟเวอร์วนไม่จบทั้งที่ไม่มีใครแก้อะไรเลย
   ตัดที่ 80 ตัวอักษร ยาวกว่านี้ป้ายบนแผนที่จะบังหมุดตัวอื่น */
const pinName = v => String(v == null ? '' : v).trim().slice(0, 80);

async function fetchServer() {
  const [lv, pn] = await Promise.all([
    rest('pile_map_levels?select=k,color,label,sort&deleted_at=is.null&order=sort.asc,k.asc'),
    rest('pile_map_pins?select=id,lat,lng,level_key,note&deleted_at=is.null'
         + '&group_key=eq.' + encodeURIComponent(SUPA.group) + '&order=created_at.asc')
  ]);
  // ลำดับคีย์ต้องเป็น pins ก่อน levels ให้ตรงกับ stateNow()
  // เพราะเราเทียบสองสถานะด้วย JSON.stringify ซึ่งคีย์สลับที่แล้วข้อความก็ไม่ตรงกันทันที
  return {
    pins:   pn.filter(p => isFinite(p.lat) && isFinite(p.lng))
              .map(p => ({ id:p.id, lat:p.lat, lng:p.lng, k:p.level_key, n:pinName(p.note) })),
    levels: lv.map(l => ({ k:l.k, color:l.color, label:String(l.label == null ? '' : l.label) }))
  };
}

/* ส่งขึ้นเซิร์ฟเวอร์เฉพาะส่วนที่ต่าง ไม่ใช่เขียนทับทั้งก้อน
   เพราะถ้าเขียนทับทั้งก้อน คนสองคนทำพร้อมกันคนหลังจะลบงานคนแรกทิ้งหมด */
async function push(before, after) {
  const jobs = [];

  /* ---------- ตารางสี ---------- */
  const bLv = {};
  before.levels.forEach((l, i) => bLv[l.k] = { l:l, i:i });
  const upLv = [];
  after.levels.forEach((l, i) => {
    const o = bLv[l.k];
    if (!o || o.l.color !== l.color || o.l.label !== l.label || o.i !== i) {
      // sort เก็บเป็นลำดับในตาราง เพราะคนใช้เรียงสีจากสั้นไปยาว ลำดับจึงมีความหมาย
      upLv.push({ k:l.k, color:l.color, label:l.label, sort:i + 1,
                  deleted_at:null, updated_at:nowISO() });
    }
  });
  if (upLv.length) {
    jobs.push(rest('pile_map_levels?on_conflict=k',
      { method:'POST', body:upLv, prefer:'resolution=merge-duplicates,return=minimal' }));
  }

  const keep = {};
  after.levels.forEach(l => keep[l.k] = 1);
  const goneLv = before.levels.filter(l => !keep[l.k]).map(l => l.k);
  if (goneLv.length) {
    jobs.push(rest('pile_map_levels?k=' + encodeURIComponent(inList(goneLv)),
      { method:'PATCH', body:{ deleted_at:nowISO() }, prefer:'return=minimal' }));
  }

  /* ---------- หมุด ---------- */
  const bPin = {};
  before.pins.forEach(p => bPin[p.id] = p);

  // หมุดที่ id ยังไม่เคยขึ้นไป = ปักใหม่ หรือ "เลิกทำ" การลบ
  // ใช้ upsert ตัวเดียวครอบทั้งสองกรณี แถวที่ถูกลบนิ่มไว้จะถูกปลด deleted_at กลับมา
  const addPin = after.pins.filter(p => !bPin[p.id]).map(p => ({
    id:p.id, lat:p.lat, lng:p.lng, level_key:p.k, note:p.n || null, group_key:SUPA.group,
    created_by:whoami(), deleted_at:null, updated_at:nowISO()
  }));
  if (addPin.length) {
    jobs.push(rest('pile_map_pins?on_conflict=id',
      { method:'POST', body:addPin, prefer:'resolution=merge-duplicates,return=minimal' }));
  }

  // หมุดเดิมที่เปลี่ยนสี — รวมเป็นกลุ่มตามสีใหม่ จะได้ยิงครั้งเดียวต่อสี ไม่ใช่ครั้งเดียวต่อหมุด
  // (ไม่ต้องดู lat/lng เพราะแอปนี้ลากหมุดย้ายที่ไม่ได้ ตำแหน่งจึงไม่เคยเปลี่ยน)
  const byLevel = {};
  after.pins.forEach(p => {
    const o = bPin[p.id];
    if (o && o.k !== p.k) (byLevel[p.k] = byLevel[p.k] || []).push(p.id);
  });
  Object.keys(byLevel).forEach(k => {
    jobs.push(rest('pile_map_pins?id=' + encodeURIComponent(inList(byLevel[k])),
      { method:'PATCH', body:{ level_key:k, updated_at:nowISO() }, prefer:'return=minimal' }));
  });

  // หมุดเดิมที่เปลี่ยนชื่อ — รวมกลุ่มแบบเดียวกับสีไม่ได้ เพราะชื่อแต่ละหมุดไม่ซ้ำกัน
  // ต้องยิงทีละหมุด แต่ปกติคนแก้ชื่อทีละตัวอยู่แล้ว จึงไม่ใช่การยิงรัว
  after.pins.forEach(p => {
    const o = bPin[p.id];
    if (!o || o.n === p.n) return;
    jobs.push(rest('pile_map_pins?id=eq.' + encodeURIComponent(p.id),
      { method:'PATCH', body:{ note:p.n || null, updated_at:nowISO() }, prefer:'return=minimal' }));
  });

  // ลบ = ลงเวลา deleted_at ไม่ได้ลบแถวจริง (สิทธิ์ลบจริงไม่ได้เปิดให้ด้วย)
  // ใครกดล้างหมุดทั้งหมด ก็ยังกู้คืนได้ด้วย SQL บรรทัดเดียว
  const live = {};
  after.pins.forEach(p => live[p.id] = 1);
  const gonePin = before.pins.filter(p => !live[p.id]).map(p => p.id);
  if (gonePin.length) {
    for (let i = 0; i < gonePin.length; i += 150) {   // กัน URL ยาวเกินตอนล้างหมุดเป็นพัน
      jobs.push(rest('pile_map_pins?id=' + encodeURIComponent(inList(gonePin.slice(i, i + 150))),
        { method:'PATCH', body:{ deleted_at:nowISO() }, prefer:'return=minimal' }));
    }
  }

  await Promise.all(jobs);
}

/* ============================================================
   ตารางสี — แก้ได้ เพิ่มได้ ลบได้ และจำไว้ในเครื่อง
   ค่าตั้งต้นแบ่งเป็นช่วง ไม่ใช่ความยาวเดี่ยว ๆ เพราะงานจริงที่เคยบันทึกไว้
   มีตั้งแต่ 6 ถึง 32 ม. กระจายเกือบทุกเมตร ถ้าทำสีละความยาวต้องใช้ 23 สี
   ซึ่งแยกด้วยตาไม่ออกบนแผนที่ — แต่ตอนนี้แก้เป็นแบบไหนก็ได้ตามใจ
   ============================================================ */
const DEFAULT_LEVELS = [
  { k:'a', color:'#1a9850', label:'ไม่เกิน 12 ม.' },
  { k:'b', color:'#8ac926', label:'13 – 15 ม.'   },
  { k:'c', color:'#ffd21f', label:'16 – 18 ม.'   },
  { k:'d', color:'#fb8b24', label:'19 – 21 ม.'   },
  { k:'e', color:'#e01e26', label:'22 – 24 ม.'   },
  { k:'f', color:'#8e44ad', label:'25 ม. ขึ้นไป' }
];
// สีสำรองสำหรับปุ่ม "เพิ่มสี" เลือกให้ต่างจากชุดเดิมพอจะแยกออกด้วยตา
const SPARE = ['#00b4d8','#7f5539','#ff5da2','#495057','#06d6a0','#9d4edd','#d62828','#118ab2'];

let levels = [];
const LV = {};
function indexLevels() {
  Object.keys(LV).forEach(k => delete LV[k]);
  levels.forEach(l => LV[l.k] = l);
}
const newKey = () => 'L' + Date.now().toString(36) + Math.random().toString(36).slice(2, 5);

/* ============================================================
   ข้อมูลหมุด — มีแค่ ตำแหน่ง + สี
   ============================================================ */
let pins = [];
let selected = null;            // สีที่จะใช้กับหมุดถัดไป
const layers = {};              // id -> circleMarker
let undoStack = [];
let editing = false;            // กำลังอยู่ในโหมดตั้งค่าสีหรือเปล่า
let legendOpen = true;          // ตารางกางอยู่หรือเปล่า = ปักหมุดได้หรือเปล่า

// id ของหมุดสร้างจากเครื่องนี้ ไม่ปล่อยให้เซิร์ฟเวอร์ตั้ง
// เพราะเราวาดหมุดก่อนส่ง ถ้ารอ id จากเซิร์ฟเวอร์ หมุดบนจอจะยังไม่มี id ให้กดลบ/เปลี่ยนสี
function uuid() {
  if (window.crypto && crypto.randomUUID) return crypto.randomUUID();
  return 'xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx'.replace(/[xy]/g, c => {
    const r = Math.random() * 16 | 0;
    return (c === 'x' ? r : (r & 0x3 | 0x8)).toString(16);
  });
}

/* ============================================================
   ตัวซิงค์
   ------------------------------------------------------------
   serverMirror = สิ่งที่เราเชื่อว่าอยู่บนเซิร์ฟเวอร์แล้ว
   ของจริงบนจอคือ pins/levels  ต่างกันเมื่อไหร่ = ยังมีของค้างต้องส่ง
   ทุกการแก้ในแอปเรียก save() อันเดียว ไม่ต้องรู้ว่าตัวเองแก้อะไรไป
   ตัวซิงค์ไปหาความต่างเอง — จุดที่ต้องแก้มีที่เดียว พลาดยากกว่า
   ============================================================ */
let serverMirror = { pins:[], levels:[] };
let loaded  = false;     // โหลดครั้งแรกสำเร็จหรือยัง ถ้ายัง ห้ามเขียนขึ้นไป
let pushing = false;
let syncTimer = null, retryWait = 0, lastErr = '';

const stateNow = () => ({
  pins:   pins.map(p => ({ id:p.id, lat:p.lat, lng:p.lng, k:p.k, n:pinName(p.n) })),
  levels: levels.map(l => ({ k:l.k, color:l.color, label:l.label }))
});
const sig   = s => JSON.stringify(s);
const dirty = () => sig(serverMirror) !== sig(stateNow());

const syncEl = document.getElementById('sync');
// เก็บโหมดล่าสุดไว้ เพราะสิทธิ์อาจมาถึงทีหลัง (เว็บหลักรู้ role ช้ากว่าโหลดหน้า)
// แล้วต้องเขียนป้ายใหม่ด้วยคำของโหมดที่ค้างอยู่ ไม่ใช่เดาว่าเป็น ok
let syncMode = 'saving';
function setSync(mode) {
  syncMode = mode;
  syncEl.className = mode === 'ok' ? '' : mode;
  // คนที่ดูอย่างเดียวไม่เคยบันทึกอะไร คำว่า "บันทึกแล้ว" เลยไม่มีความหมายกับเขา
  // สิ่งที่เขาอยากรู้คือข้อมูลที่เห็นอยู่สดหรือเปล่า
  syncEl.querySelector('.tx').textContent = canEdit
    ? (mode === 'ok' ? 'บันทึกแล้ว' : mode === 'saving' ? 'กำลังบันทึก…' : 'บันทึกไม่ขึ้น')
    : (mode === 'ok' ? 'ดูอย่างเดียว'  : mode === 'saving' ? 'กำลังโหลด…'   : 'โหลดไม่ได้');
  syncEl.title = mode === 'bad'
    ? 'กดเพื่อลองอีกครั้ง\n' + lastErr
    : canEdit ? 'ข้อมูลเก็บบน Supabase ทุกเครื่องเห็นตรงกัน'
              : 'คุณไม่มีสิทธิ์แก้แผนที่นี้ ดูได้อย่างเดียว';
  // แถบปกติซ่อนอยู่ ถ้าบันทึกไม่ขึ้นแล้วปล่อยให้ซ่อนต่อ คนปักหมุดจะไม่รู้เลยว่าของไม่ขึ้นเซิร์ฟเวอร์
  // เลยต้องดันแถบลงมาเอง (try กันไว้เพราะ setSync ถูกเรียกก่อนโค้ดแถบบนจะถูกสร้าง)
  if (mode === 'bad') { try { showBar(); } catch (e) {} }
}

function save() {
  if (!loaded || !canEdit) return;
  setSync('saving');
  clearTimeout(syncTimer);
  // หน่วงไว้ก่อน เพราะตอนพิมพ์ชื่อความยาวหรือเลื่อนจานสี save() ถูกเรียกทุกตัวอักษร
  // ถ้ายิงทุกครั้งจะได้เป็นร้อยรีเควสต์จากการพิมพ์ชื่อเดียว
  syncTimer = setTimeout(flush, 400);
}

async function flush() {
  if (!loaded || pushing) return;   // รอบที่กำลังส่งอยู่จะเรียกตัวเองต่อเมื่อเสร็จ
  const after = stateNow();
  if (sig(serverMirror) === sig(after)) { setSync('ok'); return; }

  pushing = true;
  setSync('saving');
  try {
    await push(serverMirror, after);
    serverMirror = after;
    retryWait = 0; lastErr = '';
    pushing = false;
    // ระหว่างรอเน็ตผู้ใช้อาจแก้เพิ่มไปแล้ว เทียบอีกรอบ ถ้าต่างก็ส่งต่อให้จบ
    if (dirty()) { flush(); return; }
    setSync('ok');
  } catch (err) {
    pushing = false;
    lastErr = String(err && err.message || err);
    setSync('bad');
    // ไม่ย้อนของที่ผู้ใช้เพิ่งทำทิ้ง แค่ลองใหม่ ถอยห่างขึ้นเรื่อย ๆ สูงสุด 15 วิ
    retryWait = Math.min(retryWait ? retryWait * 2 : 2000, 15000);
    clearTimeout(syncTimer);
    syncTimer = setTimeout(flush, retryWait);
  }
}

/* เอาสถานะจากเซิร์ฟเวอร์มาใส่จอ */
function applyServer(s) {
  serverMirror = { pins:s.pins.map(p => ({ id:p.id, lat:p.lat, lng:p.lng, k:p.k, n:pinName(p.n) })),
                   levels:s.levels.map(l => ({ k:l.k, color:l.color, label:l.label })) };
  levels = serverMirror.levels.map(l => Object.assign({}, l));
  // ตารางว่าง = เพิ่งสร้างฐานข้อมูล ใส่ชุดตั้งต้นให้แล้วปล่อยให้ตัวซิงค์ส่งขึ้นไปเอง
  if (!levels.length) levels = DEFAULT_LEVELS.map(l => Object.assign({}, l));
  indexLevels();
  // ทิ้งหมุดที่อ้างสีซึ่งถูกลบไปแล้ว (เครื่องอื่นลบสีทิ้งระหว่างที่เราเปิดอยู่)
  pins = serverMirror.pins.filter(p => LV[p.k]).map(p => Object.assign({}, p));
  if (!LV[selected]) selected = levels[0].k;

  // เลิกทำเก็บสถานะไว้ทั้งก้อน ถ้าของจากเครื่องอื่นเข้ามาแล้วยังกดย้อนได้
  // จะกลายเป็นลบงานที่เขาเพิ่งทำทิ้ง เลยล้างประวัติทุกครั้งที่รับของใหม่
  undoStack = [];
  const ub = document.getElementById('undo');
  if (ub) ub.disabled = true;

  map.closePopup();
  redrawAll();
}

async function loadFromServer() {
  setSync('saving');
  syncEl.querySelector('.tx').textContent = 'กำลังโหลด…';
  const s = await fetchServer();
  // ตั้ง loaded ก่อนวาด เพราะข้อความใต้ตารางสีอ่านค่านี้ไปตัดสินว่าจะบอกอะไร
  // ถ้าตั้งทีหลัง คนที่กดลองใหม่จนสำเร็จจะยังเห็นบรรทัด "ยังโหลดข้อมูลไม่ได้" ค้างอยู่
  loaded = true;
  applyServer(s);
  if (dirty()) save(); else setSync('ok');
  updatePinMode();
}

/* ดึงมาดูเป็นรอบ ๆ ว่าเครื่องอื่นแก้อะไรไปหรือเปล่า
   ไม่ใช้ realtime เพราะต้องเปิดฟีเจอร์เพิ่มบน Supabase และถือ websocket ค้างไว้
   งานนี้คนปักพร้อมกันไม่กี่คน ช้าไป 15 วินาทีไม่มีผล */
async function poll() {
  if (!loaded || pushing || dirty() || editing || document.hidden) return;
  try {
    const s = await fetchServer();
    // เช็กอีกรอบ เพราะระหว่างรอเน็ตผู้ใช้อาจเริ่มแก้ไปแล้ว ห้ามเขียนทับของที่เขาทำค้าง
    if (pushing || dirty() || editing) return;
    if (sig(s) === sig(serverMirror)) return;
    applyServer(s);
    toast('อัปเดตจากเครื่องอื่น');
  } catch (e) { /* รอบหน้าค่อยลองใหม่ ไม่ต้องรบกวนผู้ใช้ */ }
}

syncEl.onclick = () => {
  if (!syncEl.classList.contains('bad')) return;
  retryWait = 0;
  if (loaded) flush();
  else loadFromServer().catch(err => { lastErr = String(err.message || err); setSync('bad'); });
};

// ปิดแท็บตอนยังบันทึกไม่ขึ้น = งานหาย เพราะไม่มีสำเนาในเครื่องแล้ว ต้องเตือน
window.addEventListener('beforeunload', e => {
  if (loaded && dirty()) { e.preventDefault(); e.returnValue = ''; }
});

/* เก็บสำเนาทั้งชุด (หมุด + ตารางสี) ก่อนเปลี่ยนทุกครั้ง
   undo เลยย้อนได้ทุกแบบด้วยโค้ดชุดเดียว ไม่ต้องเขียนตัวย้อนแยกตามชนิดการกระทำ
   จำกัด 50 ขั้น หมุดหนึ่งตัวหนักไม่ถึง 60 ไบต์ ไม่กินหน่วยความจำ */
function snapshot() {
  undoStack.push(JSON.stringify({ pins: pins, levels: levels }));
  if (undoStack.length > 50) undoStack.shift();
  document.getElementById('undo').disabled = false;
}

   ทุกระดับที่หยุดพักคือการสั่งโหลดภาพชุดใหม่หนึ่งรอบเต็ม จำกัดเหลือ z5 แล้วเหลือ 14 ระดับ

const TH_BOUNDS = L.latLngBounds([5.4, 97.0], [20.7, 105.9]);

const map = L.map('map', {
  // zoomSnap 0 = ซูมละเอียดเป็นทศนิยม ล้อเลยไหลลื่นแทนที่จะกระโดดทีละขั้น
  zoomSnap: 0,
  zoomDelta: 1,
  maxZoom: 19,
  minZoom: 5,
  maxBounds: TH_BOUNDS,

  maxBoundsViscosity: 1.0,

/* ตำแหน่งที่จำไว้จากครั้งก่อนอาจอยู่นอกขอบเขตใหม่ หรือซูมออกกว้างกว่าที่อนุญาตแล้ว
   (คนที่เคยซูมออกไปเห็นทั้งโลกก่อนหน้านี้จะมีค่าแบบนั้นค้างอยู่ในเครื่อง)
   ถ้าส่งค่านอกขอบเข้าไปตรง ๆ แผนที่จะกระตุกเด้งกลับตอนเปิด เลยต้องดึงเข้ากรอบก่อน */
const HOME = L.latLng(13.70, 100.68);
const savedView = (() => { try { return JSON.parse(localStorage.getItem(VIEW_KEY)); } catch (e) { return null; } })();
if (savedView && isFinite(savedView.lat) && isFinite(savedView.lng)) {
  const p = L.latLng(savedView.lat, savedView.lng);
  const z = Math.min(19, Math.max(5, isFinite(savedView.z) ? savedView.z : 11));
  map.setView(TH_BOUNDS.contains(p) ? p : HOME, z);
} else {
  map.setView(HOME, 11);
}

/* maxBounds ของ Leaflet เอาไม่อยู่ตอนซูมออกสุด ต้องกันเองอีกชั้น
   วิธีคิดของมันคือเอาขอบเขตมาหดเข้าครึ่งหน้าจอ แล้วบังคับจุดกึ่งกลางให้อยู่ในกรอบที่หดแล้ว
   แต่ตอน z5 หน้าจอสูง 740 จุด ส่วนประเทศไทยสูงแค่ 354 จุด พอหดเข้าครึ่งหน้าจอกรอบเลย "กลับด้าน"
   (ขอบล่างไปอยู่เหนือขอบบน) การบังคับเลยเพี้ยน ลากลงไปได้ถึงละติจูด -8 ใต้เส้นศูนย์สูตร (เจอตอนทดสอบ)
   กันเองด้วยกฎที่ตรงไปตรงมากว่า: จุดกึ่งกลางจอต้องอยู่ในประเทศไทยเสมอ ไม่ว่าจอจะใหญ่แค่ไหน
   เช็กตอน moveend ทีเดียว ถ้าอยู่ในกรอบอยู่แล้วจะไม่ทำอะไร เลยไม่วนซ้ำไม่รู้จบ */
function clampCenter() {
  const c = map.getCenter();
  const lat = Math.min(TH_BOUNDS.getNorth(), Math.max(TH_BOUNDS.getSouth(), c.lat));
  const lng = Math.min(TH_BOUNDS.getEast(),  Math.max(TH_BOUNDS.getWest(),  c.lng));
  if (lat !== c.lat || lng !== c.lng) map.setView([lat, lng], map.getZoom(), { animate:false });
}
map.on('moveend', clampCenter);

/* crossOrigin สำคัญกว่าที่เห็น: ถ้าไม่ตั้ง เบราว์เซอร์จะขอภาพแบบ "ไม่มี CORS"

const LABEL_DELAY = 500;
function deferLabelUpdates(layer) {
  const real = layer._update.bind(layer);
  let t = null;
  layer._update = function (center) {
    clearTimeout(t);
    t = setTimeout(() => real(center), LABEL_DELAY);
  };
  // ต้องยกเลิกตัวตั้งเวลาตอนถอดชั้นออก ไม่งั้นมันไปวาดชั้นที่ไม่ได้อยู่บนแผนที่แล้ว
  layer.on('remove', () => clearTimeout(t));
}

/* ============================================================
   ตัดตัวหนังสือนอกกรุงเทพออก เหลือแค่ชื่อจังหวัด
   ------------------------------------------------------------
   ป้ายชื่อของ Esri มาเป็นรูปภาพสำเร็จ ไม่ใช่ข้อความที่เลือกปิดทีละชื่อได้
   แต่มันวาดของไม่เหมือนกันในแต่ละระดับซูม ซูมกว้างได้แค่ชื่อจังหวัด ซูมลึกจึงเริ่มมีชื่ออำเภอ ชื่อถนน ชื่อซอย
   เลยคุมด้วยสองอย่างรวมกัน คือ "ซูมอยู่ระดับไหน" กับ "ตอนนี้กำลังดูตรงไหน"

     ซูมกว้าง (<= LABEL_PLAIN_MAX)  ปล่อยป้ายทั้งประเทศ ซึ่งระดับนี้มีแค่ชื่อจังหวัดอยู่แล้ว
     ซูมลึกกว่านั้น                 ปล่อยป้ายเฉพาะตอนที่กลางจออยู่ในกรุงเทพ นอกนั้นคืนจุดใสทั้งชั้น

   จุดใสเป็น data URI ไม่ใช่ที่อยู่เว็บ เบราว์เซอร์จึงไม่ยิงคำขอออกไปเลย ไม่ใช่แค่ซ่อนทีหลัง
   ผลพลอยได้คือเวลาไปดูหน้างานต่างจังหวัด ป้ายที่เคยไปแย่งสายเชื่อมต่อจากภาพถ่ายหายไปหมด

   ตอนแรกลองตัดทีละใบตามพิกัดของใบนั้น แต่ทิ้งรอยต่อกลางจอ (ครึ่งจอมีเส้นเขตมีชื่อ อีกครึ่งโล่ง)
   เห็นชัดมากช่วงซูม 8-9 ที่กรอบกรุงเทพยังเล็กกว่าหน้าจอ ดูเหมือนแผนที่เสีย
   เลยเปลี่ยนมาตัดทั้งชั้นพร้อมกันโดยดูที่จุดกึ่งกลางจอแทน เปิดก็เปิดหมด ปิดก็ปิดหมด ไม่มีรอยต่อ

   ข้อแลกเปลี่ยนที่ต้องรู้: ซูมลึกนอกกรุงเทพจะไม่มีชื่อถนนให้อ่านเลย เหลือภาพถ่ายกับหมุดล้วน ๆ
   ============================================================ */
/* กรอบนี้คือกรุงเทพทั้งจังหวัด เผื่อขอบออกไปพอให้คลุมปริมณฑลที่ติดกันจริง ๆ
   (สมุทรปราการ นนทบุรี ปทุมฯ ตอนล่าง สมุทรสาครฝั่งติดกรุงเทพ)
   เพราะหน้างานแถวบางนา-บางพลี-พระประแดง อยู่คาบเส้นเขตกรุงเทพพอดี ถ้าตัดตรงเส้นจริงป้ายจะหายตรงที่ใช้งานบ่อยสุด */
const BKK_BOUNDS = L.latLngBounds([13.40, 100.20], [14.10, 101.05]);
/* ระดับซูมที่ยังปล่อยป้ายทั้งประเทศ นับเป็นซูมที่คนเห็นบนจอ
   ชั้นป้ายดึงจากซูมลึกลงไปหนึ่งระดับ (zoomOffset:1) เลข 7 บนจอจึงได้เนื้อหาของระดับ 8 ซึ่งเป็นชื่อจังหวัดกับเมืองใหญ่
   ขยับขึ้นเป็น 8 จะเริ่มมีชื่ออำเภอโผล่มา ขยับลงเป็น 6 ชื่อจังหวัดจะเริ่มหายไปบางจังหวัด */
const LABEL_PLAIN_MAX = 7;

function limitLabelsToBangkok(layer) {
  const realUrl = layer.getTileUrl.bind(layer);
  const allowed = () => map.getZoom() <= LABEL_PLAIN_MAX || BKK_BOUNDS.contains(map.getCenter());
  layer.getTileUrl = c => allowed() ? realUrl(c) : BLANK_PNG;

  /* เวลาข้ามเส้น ต้องสั่งวาดใหม่เอง
     Leaflet เก็บใบที่วาดไว้แล้วไว้ใช้ต่อ ไม่ได้ไปถามที่อยู่ใหม่ให้
     ถ้าไม่สั่ง พอเลื่อนจากนอกกรุงเทพกลับเข้ามา ใบที่ค้างอยู่จะยังเป็นจุดใส ป้ายไม่กลับมา
     เทียบค่าเก่ากับค่าใหม่ก่อน สั่งเฉพาะตอนสถานะเปลี่ยนจริง เลื่อนอยู่ในกรุงเทพไปมาจะไม่โดนวาดใหม่ทุกครั้ง */
  let last = allowed();
  const recheck = () => {
    const now = allowed();
    if (now === last) return;
    last = now;
    if (map.hasLayer(layer)) layer.redraw();   // redraw เรียก _update ที่ถูกหน่วงไว้ ป้ายจึงยังตามหลังภาพเหมือนเดิม
  };
  map.on('moveend zoomend', recheck);
  layer.on('remove', () => map.off('moveend zoomend', recheck));
}
let baseLayer = null, baseOverlay = null;

function setBasemap(key) {
  const bm = BASEMAPS[key] || BASEMAPS.satellite;
  const oldBase = baseLayer, oldOverlay = baseOverlay;
  baseLayer = L.tileLayer(bm.url, BASE_OPTS).addTo(map);
  attachRetry(baseLayer);
  baseLayer.bringToBack();

  /* ชั้นป้ายชื่อต้องรอให้ภาพถ่ายขึ้นก่อน ห้ามปล่อยพร้อมกัน
     หนึ่งหน้าจอมือถือใช้ภาพถ่าย 12 ใบ แต่ใช้ป้ายชื่อถึง 28 ใบ (ป้ายเป็นไทล์ 128px เลยเยอะกว่าเท่าตัว)
     เบราว์เซอร์ต่อเซิร์ฟเวอร์เดียวกันได้ทีละ 6 เส้นเท่านั้น ปล่อยพร้อมกันภาพถ่ายต้องไปต่อคิวหลังป้าย
     วัดบนเน็ตเร็ว ๆ แล้วภาพถ่ายขึ้นช้าลงจาก 296 เป็น 431 มิลลิวินาที
     ที่หน้างานสัญญาณอ่อนช่องว่างนี้จะถ่างกว่านี้มาก เพราะแต่ละรอบใช้เวลาเป็นวินาที
     ป้ายชื่อมาช้าหน่อยไม่เป็นไร คนหาตำแหน่งจากภาพพื้นที่ ไม่ได้หาจากชื่อถนน */
  baseOverlay = null;
  if (bm.overlay) {
    let labelsAdded = false;
    const addLabels = () => {
      if (labelsAdded || !map.hasLayer(baseLayer)) return;
      labelsAdded = true;
      baseOverlay = L.tileLayer(bm.overlay, LABEL_OPTS);
      // ต้องครอบ getTileUrl ก่อน addTo ไม่งั้นรอบแรกยิงป้ายนอกกรุงเทพออกไปแล้ว
      limitLabelsToBangkok(baseOverlay);
      baseOverlay.addTo(map);
      // ครอบ _update หลัง addTo เพื่อให้รอบแรกวาดทันที แล้วค่อยหน่วงเฉพาะรอบที่ตามมาตอนซูม/เลื่อน
      deferLabelUpdates(baseOverlay);
    };
    baseLayer.once('load', addLabels);
    // กันเหนียว: ถ้าภาพถ่ายบางใบโหลดไม่สำเร็จจน load ไม่ยิงสักที ป้ายจะได้ไม่หายถาวร
    setTimeout(addLabels, 4000);
  }

  // ถอดชั้นเก่าหลังชั้นใหม่โหลดเสร็จ ไม่งั้นจอขาววาบระหว่างรอไทล์
  const drop = () => {
    if (oldBase) map.removeLayer(oldBase);
    if (oldOverlay) map.removeLayer(oldOverlay);
  };
  if (oldBase) {
    baseLayer.once('load', drop);
    setTimeout(drop, 1500);   // กันเหนียวถ้าไทล์โหลดไม่สำเร็จ ชั้นเก่าจะได้ไม่ค้างทับกัน
  }
}

/* ============================================================
   สัญญาณอ่อนที่หน้างาน
   Leaflet ไม่ลองโหลดไทล์ซ้ำให้ ใบไหนพลาดก็ค้างเป็นช่องเทาถาวร
   เต็มจอมีตั้ง 20-80 ใบ สัญญาณกระตุกนิดเดียวก็แหว่งแล้ว ต้องลองใหม่ให้เอง
   ============================================================ */
let tileFailSeen = 0, tileFailToldAt = 0;

function attachRetry(layer) {
  layer.on('tileerror', e => {
    const img = e.tile;
    if (!img) return;
    const n = (img._try || 0) + 1;
    if (n > 3) {
      // ยอมแพ้ใบนี้แล้ว นับไว้เพื่อบอกคนใช้ว่าทำไมภาพแหว่ง
      // ไม่บอกเลยคนจะนึกว่าเว็บพัง ทั้งที่เป็นเรื่องสัญญาณ
      tileFailSeen++;
      if (tileFailSeen >= 4 && Date.now() - tileFailToldAt > 20000) {
        tileFailToldAt = Date.now();
        toast('ภาพบางส่วนโหลดไม่ได้ — สัญญาณอ่อน ลองเลื่อนแผนที่ไปมาหรือรอสักครู่');
      }
      return;
    }
    img._try = n;
    const base = img.src.split('?')[0];
    // ต่อ ?r= ท้ายที่อยู่ ไม่งั้นเบราว์เซอร์จะคืนผลที่พลาดไปแล้วมาให้ทันทีโดยไม่ลองจริง
    // (ฝั่ง service worker ตัดท้ายนี้ออกก่อนเก็บ ไทล์ใบเดียวจึงไม่ถูกเก็บซ้ำหลายก้อน)
    setTimeout(() => { img.src = base + '?r=' + n; }, 600 * n);  // ถอยห่างขึ้นเรื่อย ๆ ไม่รัวซ้ำตอนสัญญาณแย่
  });
}

// เรียกตรง ๆ ไม่ต้องอ่านค่าที่เคยเลือกไว้ในเครื่อง
// เครื่องที่เคยใช้อยู่ก่อนจะมีค่าเก่าค้างเป็น 'ถนน' ถ้าไปอ่านมาใช้ก็จะได้แผนที่ถนนเหมือนเดิม
setBasemap('satellite');

/* ============================================================
   แถบบนแบบซ่อนอัตโนมัติ
   ชี้ขอบบน = ไหลลงมา เอาเมาส์ออก = หุบกลับ ให้ภาพดาวเทียมได้เต็มจอที่สุด
   ============================================================ */
const barEl     = document.getElementById('bar');
const barHandle = document.getElementById('barHandle');
let barStuck = false;      // แตะหูจับ = ตรึงไว้ ไม่ให้หุบเอง (นิ้วไม่มีการชี้ค้างแบบเมาส์)
let barTimer = null;

function showBar() { clearTimeout(barTimer); barEl.classList.add('show'); }
function hideBar() {
  // บันทึกไม่ขึ้นแล้วแถบหุบหาย = ไม่มีใครรู้ว่าของยังไม่ขึ้นเซิร์ฟเวอร์ ตอนพังต้องค้างไว้ให้เห็น
  if (barStuck || syncMode === 'bad') return;
  barEl.classList.remove('show');
}
function hideBarSoon(ms) { clearTimeout(barTimer); barTimer = setTimeout(hideBar, ms || 400); }

/* ไม่วางแถบใส ๆ ดักเมาส์ไว้ที่ขอบบน เพราะมันจะไปกินการลากแผนที่แถวนั้น
   ใช้วิธีดูตำแหน่งเมาส์เอาแทน แผนที่เลยยังลากได้ทุกจุดเหมือนเดิม */
addEventListener('mousemove', e => {
  if (e.clientY <= 4) showBar();
  else if (!barStuck && barEl.classList.contains('show') && e.clientY > barEl.offsetHeight + 28) hideBarSoon(250);
});
addEventListener('mouseleave', () => hideBarSoon(200));
barEl.addEventListener('mouseenter', showBar);
barEl.addEventListener('mouseleave', () => hideBarSoon(400));

// จอสัมผัส: แตะหูจับเปิด แตะซ้ำปิด (หูจับเลื่อนลงไปอยู่ใต้แถบ เลยยังกดปิดได้)
barHandle.addEventListener('click', e => {
  e.stopPropagation();
  if (barEl.classList.contains('show')) { barStuck = false; hideBar(); }
  else { barStuck = true; showBar(); }
});

map.on('moveend zoomend', () => {
  const c = map.getCenter();
  try { localStorage.setItem(VIEW_KEY, JSON.stringify({ lat:c.lat, lng:c.lng, z:map.getZoom() })); } catch (e) {}
});

/* ============================================================
   ล้อเมาส์ / แทร็กแพด
   ------------------------------------------------------------
   ของ Leaflet เองนับทุก wheel event เป็น "ซูม" ทั้งเลื่อนสองนิ้วและบีบนิ้ว
   แล้วซูมทีละขั้นแบบมีอนิเมชัน พอหมุนล้อรัว ๆ คำสั่งซูมจะซ้อนกันเป็นสิบ ๆ ครั้ง
   ภาพเลยกระตุก เราจึงปิดของมันแล้วดักเองที่นี่

   ตอนซูม เรียก setZoom/setZoomAround ทุกจังหวะล้อไม่ได้ เพราะแต่ละครั้งเป็นการ
   รีเซ็ตมุมมองเต็ม ๆ ไทล์จะถูกทิ้งแล้วขอใหม่ หมุนเร็ว ๆ ทีจะกะพริบ
   ทางที่ใช้คือ _move พร้อมธง pinch ซึ่งเป็นสิ่งที่ Leaflet ใช้เองตอนบีบนิ้วบนมือถือ
   มันย่อ/ขยายเฉพาะชั้นไทล์ (GPU) ส่วนหมุดถูกย้ายไปตำแหน่งใหม่จริง ๆ
   ============================================================ */
let panRAF = null, pendingDX = 0, pendingDY = 0;
let zoomAnchor = null, commitTimer = null, lastSettledZoom = 0;

function zoomAroundAnchor(zoom) {
  const latlng = map.containerPointToLatLng(zoomAnchor);
  // คณิตเดียวกับที่ setZoomAround ใช้: จุดใต้นิ้ว/เมาส์อยู่กับที่
  const scale    = map.getZoomScale(zoom),
        viewHalf = map.getSize().divideBy(2),
        offset   = map.latLngToContainerPoint(latlng).subtract(viewHalf).multiplyBy(1 - 1 / scale),
        center   = map.containerPointToLatLng(viewHalf.add(offset));

  map._move(center, zoom, { pinch:true, round:false });

  // หมุดเป็น SVG ที่ Leaflet สเกลทั้งชั้นแทนการวาดใหม่ และสเกลนั้นสะสมไปเรื่อย ๆ
  // จนกว่าจะมี zoomend เลยเคาะ zoomend ทุก 1 ระดับระหว่างทาง ให้หมุดวาดใหม่ที่ขนาดจริง
  if (Math.abs(zoom - lastSettledZoom) >= 1) {
    map._moveEnd(true);
    lastSettledZoom = zoom;
  }
}

function endZoomGesture() {
  if (!zoomAnchor) return;
  map._moveEnd(true);   // ปิดท้ายด้วย zoomend ให้หมุดวาดใหม่ที่ขนาดจริง
  zoomAnchor = null; commitTimer = null; lastSettledZoom = map.getZoom();
}

// ล้อเมาส์จริงส่งค่าเป็นหน่วย "บรรทัด/หน้า" (deltaMode ไม่ใช่ 0) ต่างจากแทร็กแพด
// เคสนั้นหมุนล้อ = ซูม ตามที่คนใช้เมาส์คาดหวัง
// ส่วนแทร็กแพด: เลื่อนสองนิ้ว = เลื่อนแผนที่, บีบนิ้ว = ซูม (Chrome ส่งบีบนิ้วมาเป็น ctrl+wheel)
const wheelZooms = e => e.ctrlKey || e.deltaMode !== 0;

map.getContainer().addEventListener('wheel', function (e) {
  e.preventDefault();
  if (wheelZooms(e)) {
    if (!zoomAnchor) { zoomAnchor = map.mouseEventToContainerPoint(e); lastSettledZoom = map.getZoom(); }
    // deltaMode 1 = บรรทัด, 2 = หน้า แปลงเป็นพิกเซลก่อน ไม่งั้นล้อเมาส์หมุนทีได้ซูมนิดเดียว
    const px = e.deltaY * (e.deltaMode === 1 ? 16 : e.deltaMode === 2 ? 400 : 1);
    const wanted = map.getZoom() - px * 0.015;
    zoomAroundAnchor(Math.max(map.getMinZoom(), Math.min(map.getMaxZoom(), wanted)));
    clearTimeout(commitTimer);
    commitTimer = setTimeout(endZoomGesture, 120);
  } else {
    clearTimeout(commitTimer); endZoomGesture();
    pendingDX += e.deltaX;
    pendingDY += e.deltaY;
    if (!panRAF) {
      panRAF = requestAnimationFrame(function () {
        map.panBy([pendingDX, pendingDY], { animate:false });
        pendingDX = 0; pendingDY = 0;
        panRAF = null;
      });
    }
  }
}, { passive:false });

/* ============================================================
   หมุด
   ============================================================ */
function tipOpts() { return { direction:'top', offset:[0,-10] }; }

function drawPin(p) {
  const m = L.circleMarker([p.lat, p.lng], {
    radius:8, color:'#fff', weight:2, opacity:1,
    fillColor: LV[p.k].color, fillOpacity:1
  }).addTo(map);
  // ชี้ค้างแล้วบอกความยาวเลย จะได้ไม่ต้องกวาดตาไปอ่านตารางสีทุกครั้ง
  m.bindTooltip(pinTip(p), tipOpts());
  m.bindPopup(() => popupHtml(p), { closeButton:false, autoPan:true });
  layers[p.id] = m;
}

/* ข้อความตอนชี้ค้างบนหมุด
   ถ้าตั้งชื่อไว้ให้ขึ้นชื่อนำ แล้วค่อยต่อด้วยความยาว
   เพราะพอหมุดเยอะ ๆ สิ่งที่คนมองหาคือ "อันไหนคืองานไหน" ไม่ใช่ความยาวซึ่งดูจากสีก็รู้แล้ว */
function pinTip(p) {
  const len = LV[p.k].label || '(ไม่มีชื่อ)';
  return p.n ? p.n + ' · ' + len : len;
}

function popupHtml(p) {
  const head = `<div class="pp-now"><span class="sw" style="background:${LV[p.k].color}"></span>${esc(LV[p.k].label) || '(ไม่มีชื่อ)'}</div>`;
  // ดูอย่างเดียว: บอกแค่ว่าหมุดนี้คือความยาวเท่าไหร่ ไม่ต้องมีปุ่มที่กดไม่ได้มาให้รก
  // แต่ถ้ามีชื่อไซต์งานต้องให้เห็นด้วย เพราะคนดูอย่างเดียวคือคนที่ต้องการรู้ว่านี่งานอะไรมากที่สุด
  if (!canEdit) return head
    + (p.n ? `<div class="pp-nm">${esc(p.n)}</div>` : '')
    + `<div class="pp-lbl">${p.lat.toFixed(5)}, ${p.lng.toFixed(5)}</div>`;
  const sw = levels.map(l =>
    `<button class="pp-c${l.k === p.k ? ' on' : ''}" data-pin="${p.id}" data-k="${l.k}"
             style="background:${l.color}" title="${escAttr(l.label)}"></button>`).join('');
  return head + `<div class="pp-lbl">ชื่อไซต์งาน (ไว้ใช้ค้นหา)</div>
          <input class="pp-nin" data-name="${p.id}" type="text" maxlength="80"
                 value="${escAttr(p.n || '')}" placeholder="เช่น บ้านคุณสมชาย">
          <div class="pp-lbl">เปลี่ยนสี</div>
          <div class="pp-row">${sw}</div>
          <button class="pp-del" data-del="${p.id}">ลบหมุดนี้</button>`;
}

const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g,
  c => ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' }[c]));
const escAttr = esc;

function redrawAll() {
  Object.keys(layers).forEach(id => { map.removeLayer(layers[id]); delete layers[id]; });
  pins.forEach(drawPin);
  renderLevels();
}

// เปลี่ยนสี/ชื่อของระดับหนึ่ง แล้วอัปเดตเฉพาะหมุดที่ใช้ระดับนั้น
// ไม่วาดใหม่ทั้งแผนที่ เพราะตอนพิมพ์ชื่อจะโดนเรียกทุกตัวอักษร
function applyLevelStyle(k) {
  const l = LV[k]; if (!l) return;
  pins.forEach(p => {
    if (p.k !== k) return;
    const m = layers[p.id]; if (!m) return;
    m.setStyle({ fillColor: l.color });
    m.unbindTooltip().bindTooltip(l.label || '(ไม่มีชื่อ)', tipOpts());
  });
}

function refreshCounts() {
  const n = {};
  pins.forEach(p => n[p.k] = (n[p.k] || 0) + 1);
  levels.forEach(l => {
    const el = document.querySelector('.lv[data-k="' + l.k + '"] .n');
    if (el) el.textContent = n[l.k] || '';
  });
  document.getElementById('count').textContent =
    pins.length ? 'ทั้งหมด ' + pins.length + ' หมุด' : 'ยังไม่มีหมุด';
  document.getElementById('clear').disabled = !pins.length;
}

/* คนจำนวนมากติดนิสัยดับเบิลคลิกเพื่อซูม พอคลิก = ปักหมุด ดับเบิลคลิกเลยได้หมุดซ้อนกันสองอัน
   (ทดสอบแล้วเป็นจริง: ดับเบิลคลิกครั้งเดียวหมุดเพิ่มจาก 4 เป็น 6)
   แก้โดยมองข้ามคลิกที่ 2 ถ้ามาภายใน 350 มิลลิวินาที และห่างจากคลิกแรกไม่เกิน 12 พิกเซล
   เลือกวิธีนี้แทนการหน่วงรอดูว่าจะมีคลิกที่สองมั้ย เพราะการหน่วงจะทำให้หมุดตามมือไม่ทันทุกครั้ง
   ส่วนการปักสองจุดซ้อนที่เดียวกันในเสี้ยววินาที ไม่ใช่สิ่งที่คนตั้งใจทำอยู่แล้ว */
let lastClick = { t:0, x:0, y:0 };

// loaded: ก่อนโหลดข้อมูลเสร็จ ห้ามปัก เพราะหมุดที่ปักไว้จะถูกของจากเซิร์ฟเวอร์ทับหายไป

/* จอสัมผัสต้องกดสวิตช์ก่อนถึงจะปักได้ เมาส์ปักได้เลยเหมือนเดิม
   เช็คที่ "ชนิดตัวชี้" ไม่ใช่ความกว้างจอ เพราะแท็บเล็ตจอใหญ่ก็ใช้นิ้วเหมือนกัน */
const IS_TOUCH  = matchMedia('(pointer: coarse)').matches;
// คำที่ใช้เรียกการกดหน้าจอ ต้องพูดให้ตรงกับของที่อยู่ในมือ
// บอกคนถือมือถือว่า "คลิก" มันสะดุด และทำให้ลังเลว่าต้องทำอะไรกันแน่
const TAP       = IS_TOUCH ? 'แตะ' : 'คลิก';
let   pinArmed  = !IS_TOUCH;
const pinArmBtn = document.getElementById('pinArm');

const canPin = () => loaded && canEdit && legendOpen && !editing && pinArmed;

map.on('click', e => {
  if (!canPin()) return;
  const now = Date.now(), pt = e.containerPoint;
  if (now - lastClick.t < 350 &&
      Math.abs(pt.x - lastClick.x) < 12 && Math.abs(pt.y - lastClick.y) < 12) return;
  lastClick = { t:now, x:pt.x, y:pt.y };

  snapshot();
  const p = { id:uuid(), n:'',
              lat:+e.latlng.lat.toFixed(6), lng:+e.latlng.lng.toFixed(6), k:selected };
  pins.push(p);
  drawPin(p);
  save();
  refreshCounts();
});

// ป๊อปอัปถูกสร้างใหม่ทุกครั้งที่เปิด เลยดักคลิกที่ document แทนการผูกปุ่มทีละตัว
document.addEventListener('click', e => {
  if (!canEdit) return;
  const del = e.target.closest('.pp-del');
  if (del) {
    snapshot();
    const id = del.dataset.del;
    pins = pins.filter(p => p.id !== id);
    if (layers[id]) { map.removeLayer(layers[id]); delete layers[id]; }
    save(); refreshCounts(); map.closePopup();
    return;
  }
  const c = e.target.closest('.pp-c');
  if (c) {
    snapshot();
    const p = pins.find(x => x.id === c.dataset.pin);
    if (!p) return;
    p.k = c.dataset.k;
    const m = layers[p.id];
    m.setStyle({ fillColor: LV[p.k].color });
    m.unbindTooltip().bindTooltip(pinTip(p), tipOpts());
    save(); refreshCounts(); map.closePopup();
  }
});

/* พิมพ์ชื่อไซต์งานในป๊อปอัป
   ไม่เก็บ snapshot ให้ "เลิกทำ" ทุกตัวอักษร ไม่งั้นกดเลิกทำหนึ่งครั้งจะถอยได้แค่อักษรเดียว
   เก็บครั้งเดียวตอนเริ่มแก้ชื่อหมุดตัวนั้น กดเลิกทำจึงได้ชื่อเดิมกลับมาทั้งคำ
   save() มีหน่วง 400 ms อยู่แล้ว การพิมพ์รัวจึงไม่กลายเป็นยิงเซิร์ฟเวอร์ทุกตัวอักษร */
let nameEditing = null;
document.addEventListener('input', e => {
  if (!canEdit) return;
  const box = e.target.closest('.pp-nin');
  if (!box) return;
  const p = pins.find(x => x.id === box.dataset.name);
  if (!p) return;
  if (nameEditing !== p.id) { snapshot(); nameEditing = p.id; }
  p.n = pinName(box.value);
  const m = layers[p.id];
  if (m) m.unbindTooltip().bindTooltip(pinTip(p), tipOpts());
  save();
});
// ปิดป๊อปอัปแล้วถือว่าจบการแก้ชื่อรอบนี้ รอบหน้าจึงเก็บ snapshot ใหม่
map.on('popupclose', () => { nameEditing = null; });

/* ============================================================
   ตารางสี: โหมดปกติ = ปุ่มเลือกสี / โหมดตั้งค่า = แก้สีกับความยาว
   แยกสองโหมดเพราะถ้ารวมกัน คลิกแถวเดียวจะไม่รู้ว่าหมายถึง "เลือกสีนี้"
   หรือ "กำลังจะแก้สีนี้"
   ============================================================ */
const legendEl  = document.getElementById('legend');
const levelsBox = document.getElementById('levels');
const openBtn   = document.getElementById('legendOpen');
const hintEl    = document.getElementById('hint');

function renderLevels() {
  levelsBox.innerHTML = levels.map((l, i) => editing
    ? `<div class="lv edit" data-k="${l.k}">
         <input type="color" class="ec" value="${escAttr(toHex(l.color))}" title="เลือกสี">
         <input type="text" class="et" value="${escAttr(l.label)}" maxlength="24"
                placeholder="เช่น 16 – 18 ม." spellcheck="false">
         <button class="ed" title="ลบสีนี้">&times;</button>
       </div>`
    // ดูอย่างเดียว: ไม่ไฮไลต์สีที่ "เลือกอยู่" เพราะมันสื่อว่ากดแล้วจะได้ปักหมุด ซึ่งไม่จริง
    //               ตารางกลายเป็นคำอธิบายสีเฉย ๆ
    : `<div class="lv${canEdit && l.k === selected ? ' on' : ''}" data-k="${l.k}"
            title="${canEdit ? 'กดเลข ' + (i + 1) + ' ก็ได้' : ''}">
         <span class="sw" style="background:${escAttr(l.color)}"></span>
         <span class="nm">${esc(l.label) || '(ไม่มีชื่อ)'}</span><span class="n"></span>
       </div>`).join('');
  if (!editing) refreshCounts();
  updateHint();
}

// input type=color รับได้เฉพาะ #rrggbb ถ้าค่าที่เก็บไว้เป็นรูปแบบอื่นจะเด้งเป็นดำ
function toHex(c) {
  return /^#[0-9a-f]{6}$/i.test(c) ? c : '#888888';
}

function updateHint() {
  hintEl.innerHTML = !loaded
    ? 'ยังโหลดข้อมูลไม่ได้ — กดไฟแดงมุมขวาบนเพื่อลองใหม่'
    : !canEdit
      ? 'คุณดูได้อย่างเดียว · ' + TAP + 'หมุดเพื่อดูความยาว'
      : editing
        ? 'แก้สีและความยาวได้เลย · ตอนตั้งค่าจะยังไม่ปักหมุด'
        // จอสัมผัสต้องกดสวิตช์มุมขวาล่างก่อน บอกให้ตรงกับที่กดได้จริงตอนนั้น
        // ถ้าเขียน "แตะแผนที่เพื่อปักหมุด" ทิ้งไว้ตลอด คนจะแตะแล้วไม่เกิดอะไรแล้วคิดว่าพัง
        : IS_TOUCH
          ? (pinArmed ? 'แตะแผนที่เพื่อปักหมุด · แตะหมุดเพื่อแก้/ลบ'
                      : 'กดปุ่ม "ปักหมุด" มุมขวาล่างก่อนถึงจะปักได้ · แตะหมุดเพื่อแก้/ลบ')
          : 'คลิกแผนที่เพื่อปักหมุด · คลิกหมุดเพื่อแก้/ลบ';
}

/* ซ่อนทุกปุ่มที่กดแล้วเปลี่ยนข้อมูล ตอนคนเปิดไม่มีสิทธิ์แก้
   ซ่อนดีกว่าปล่อยให้กดแล้วเด้งว่า "ไม่มีสิทธิ์" เพราะอย่างหลังคือให้ความหวังแล้วปฏิเสธ */
function applyEditMode() {
  canEdit = resolveCanEdit();
  if (!canEdit && editing) {        // ถูกถอดสิทธิ์ระหว่างที่เปิดโหมดตั้งค่าค้างอยู่
    editing = false;
    document.getElementById('editToggle').classList.remove('on');
    legendEl.classList.remove('editing');
  }
  // คืนค่าเป็นค่าว่าง ไม่ใช่ inline-block เพื่อให้ CSS เป็นคนตัดสินเหมือนตอนไม่เคยถูกแตะ
  ['editToggle', 'undo', 'clear', 'addLevel'].forEach(id => {
    const el = document.getElementById(id);
    if (el) el.style.display = canEdit ? '' : 'none';
  });
  // ปุ่มตอนหุบเคยเขียนว่า "คลิกแผนที่ไม่ปักหมุด" ซึ่งไม่เกี่ยวอะไรกับคนที่ปักไม่ได้อยู่แล้ว
  const lbl = openBtn.querySelector('span:last-child');
  if (lbl) lbl.textContent = canEdit ? TAP + 'แผนที่ไม่ปักหมุด' : 'ดูตารางสี';
  const col = document.getElementById('collapse');
  if (col) col.title = canEdit ? 'หุบตาราง (คลิกแผนที่จะไม่ปักหมุด)' : 'หุบตาราง';
  setSync(syncMode);              // ป้ายมุมขวาเปลี่ยนคำตามสิทธิ์ ต้องเขียนใหม่ด้วย
  renderLevels();
  updatePinMode();
}

function selectLevel(k) {
  if (!LV[k] || editing || !canEdit) return;
  selected = k;
  document.querySelectorAll('.lv').forEach(el => el.classList.toggle('on', el.dataset.k === k));
}

levelsBox.addEventListener('click', e => {
  if (editing) {
    const d = e.target.closest('.ed');
    if (d) removeLevel(d.closest('.lv').dataset.k);
    return;
  }
  const row = e.target.closest('.lv');
  if (row) selectLevel(row.dataset.k);
});

// ใช้ input ไม่ใช่ change เพื่อให้หมุดบนแผนที่เปลี่ยนตามทันทีขณะเลื่อนจานสี
levelsBox.addEventListener('input', e => {
  const row = e.target.closest('.lv'); if (!row) return;
  const l = LV[row.dataset.k]; if (!l) return;
  if (e.target.classList.contains('ec')) l.color = e.target.value;
  else if (e.target.classList.contains('et')) l.label = e.target.value;
  applyLevelStyle(l.k);
  save();
});
// ถ่ายรูปสถานะไว้ตอนเริ่มแก้ครั้งแรกของช่องนั้น ไม่ใช่ทุกตัวอักษร
// ไม่งั้นกดเลิกทำหนึ่งครั้งจะย้อนได้แค่ตัวอักษรเดียว
levelsBox.addEventListener('focusin', e => {
  if (e.target.matches('.ec, .et')) snapshot();
});

function addLevel() {
  if (!loaded || !canEdit) return;   // ยังไม่รู้ว่าบนเซิร์ฟเวอร์มีสีอะไรอยู่ เพิ่มไปก็โดนทับตอนโหลดสำเร็จ
  snapshot();
  const used = levels.map(l => l.color.toLowerCase());
  const color = SPARE.find(c => used.indexOf(c) === -1) || '#888888';
  levels.push({ k:newKey(), color:color, label:'' });
  indexLevels(); save(); renderLevels();
  // โฟกัสช่องชื่อของแถวใหม่ทันที จะได้พิมพ์ต่อได้เลยไม่ต้องเล็งเมาส์
  const last = levelsBox.lastElementChild;
  if (last) { const t = last.querySelector('.et'); if (t) t.focus(); }
}

function removeLevel(k) {
  if (!canEdit) return;
  if (levels.length <= 1) { toast('ต้องเหลือสีไว้อย่างน้อย 1 สี'); return; }
  const used = pins.filter(p => p.k === k).length;
  if (used && !confirm('สีนี้มีหมุดอยู่ ' + used + ' จุด\nลบสีแล้วหมุดเหล่านั้นจะหายไปด้วย\n(กด "เลิกทำ" เอากลับได้)')) return;
  snapshot();
  levels = levels.filter(l => l.k !== k);
  pins = pins.filter(p => p.k !== k);
  indexLevels();
  if (!LV[selected]) selected = levels[0].k;
  save(); redrawAll();
}

document.getElementById('addLevel').onclick = addLevel;

document.getElementById('editToggle').onclick = function () {
  if (!canEdit) return;
  if (!loaded) { toast('ยังโหลดข้อมูลไม่เสร็จ'); return; }
  editing = !editing;
  this.classList.toggle('on', editing);
  legendEl.classList.toggle('editing', editing);
  this.title = editing ? 'เสร็จแล้ว' : 'ตั้งค่าสีและความยาว';
  renderLevels();
  updatePinMode();
};

/* ---------- หุบ / กาง = สวิตช์เปิดปิดการปักหมุด ---------- */
function setLegendOpen(v) {
  legendOpen = v;
  legendEl.classList.toggle('hidden', !v);
  openBtn.classList.toggle('show', !v);
  if (!v && editing) {               // หุบขณะตั้งค่าอยู่ ให้ออกจากโหมดตั้งค่าไปเลย
    editing = false;
    document.getElementById('editToggle').classList.remove('on');
    legendEl.classList.remove('editing');
    renderLevels();
  }
  // ปุ่มตอนหุบโชว์สีที่เลือกไว้ จะได้รู้ว่ากางกลับมาแล้วจะปักด้วยสีอะไร
  const sw = openBtn.querySelector('.sw');
  if (sw && LV[selected]) sw.style.background = LV[selected].color;
  try { localStorage.setItem(OPEN_KEY, v ? '1' : '0'); } catch (e) {}
  updatePinMode();
}
function updatePinMode() {
  map.getContainer().classList.toggle('pinning', canPin());
  if (!pinArmBtn) return;
  // โชว์สวิตช์เฉพาะตอนที่กดแล้วได้ปักจริง ไม่งั้นเป็นปุ่มหลอกให้กดเปล่า
  const usable = IS_TOUCH && canEdit && legendOpen && !editing;
  pinArmBtn.classList.toggle('show', usable);
  pinArmBtn.classList.toggle('on', pinArmed);
  const tx = pinArmBtn.querySelector('.tx');
  if (tx) tx.textContent = pinArmed ? 'กำลังปัก' : 'ปักหมุด';
  const sw = pinArmBtn.querySelector('.sw');
  if (sw) sw.style.background = (pinArmed && LV[selected]) ? LV[selected].color : 'transparent';
  updateHint();                 // ข้อความใต้ตารางสีบอกวิธีใช้ ต้องเปลี่ยนตามสวิตช์ด้วย
}

if (pinArmBtn) pinArmBtn.addEventListener('click', e => {
  e.stopPropagation();          // กันไม่ให้คลิกทะลุไปโดนแผนที่แล้วปักหมุดใต้ปุ่ม
  pinArmed = !pinArmed;
  updatePinMode();
  toast(pinArmed ? 'แตะแผนที่เพื่อปักหมุด' : 'ปิดการปักแล้ว — เลื่อนแผนที่ได้ตามสบาย');
});

/* ============================================================
   ภาพถ่ายที่เคยเปิดแล้วจะถูกเก็บไว้ในเครื่องให้เอง
   ไม่มีปุ่มให้กด ไม่ต้องสั่ง — เปิดดูตรงไหน ตรงนั้นก็ถูกเก็บไว้เอง (ตัวจัดการอยู่ใน sw.js)
   กลับมาดูที่เดิมอีกครั้งจึงขึ้นทันทีแม้สัญญาณไม่ดี แต่ที่ที่ไม่เคยเปิดยังต้องใช้เน็ตอยู่

   ของเดิมมีปุ่ม "เก็บภาพลงเครื่อง" ไว้สั่งโหลดล่วงหน้าทั้งพื้นที่ ถอดออกไปแล้ว
   ============================================================ */
// ขอให้ service worker ทำงาน เผื่อมีคนเปิดไฟล์แผนที่ตรง ๆ ไม่ได้ผ่านหน้าเว็บหลัก
// ถ้าไม่มีตัวนี้คุม ของที่เก็บไว้จะไม่ถูกหยิบมาใช้ เก็บไปก็เท่านั้น
if (navigator.serviceWorker && !navigator.serviceWorker.controller) {
  navigator.serviceWorker.register('sw.js').catch(() => {});
}

document.getElementById('collapse').onclick = () => {
  setLegendOpen(false);
  toast('หุบแล้ว — ' + TAP + 'แผนที่จะไม่ปักหมุด');
};
openBtn.onclick = () => setLegendOpen(true);

document.addEventListener('keydown', e => {
  if (e.metaKey || e.ctrlKey || e.altKey) return;
  // อย่าไปแย่งปุ่มตอนกำลังพิมพ์ชื่อความยาวอยู่
  // ต้องเช็ก nodeType ก่อนเรียก matches เพราะปลายทางของ keydown เป็น document ได้
  // ซึ่งไม่มีเมธอดนี้ แล้วจะโยน TypeError ทิ้งทั้งตัวจัดการคีย์ (เจอตอนเทสต์)
  if (e.target && e.target.nodeType === 1 && e.target.matches('input, textarea')) {
    if (e.key === 'Escape' || e.key === 'Enter') e.target.blur();
    return;
  }
  const i = parseInt(e.key, 10);

});

/* ============================================================
